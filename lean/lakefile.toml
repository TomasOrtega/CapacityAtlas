name = "CapacityAtlas"
version = "0.2.0"
defaultTargets = ["CapacityAtlas"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "CapacityAtlasUtil"

[[lean_lib]]
name = "CapacityAtlasForMathlib"

[[lean_lib]]
name = "CapacityAtlas"
[lean_lib.leanOptions]
warn.sorry = false

[[lean_exe]]
name = "capacity_audit"
root = "CapacityAtlasAudit"
supportInterpreter = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"
