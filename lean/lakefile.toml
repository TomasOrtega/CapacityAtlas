name = "CapacityAtlas"
version = "0.2.0"
defaultTargets = ["CapacityAtlas"]

[leanOptions]
autoImplicit = false
linter.missingDocs = true

[[lean_lib]]
name = "CapacityAtlasUtil"
globs = ["CapacityAtlasUtil.*"]

[[lean_lib]]
name = "CapacityAtlasForMathlib"
globs = ["CapacityAtlasForMathlib.*"]

[[lean_lib]]
name = "CapacityAtlas"
globs = ["CapacityAtlas.*"]
[lean_lib.leanOptions]
warn.sorry = false

[[lean_exe]]
name = "capacity_audit"
root = "CapacityAtlasAudit"
supportInterpreter = true

[[lean_lib]]
name = "CapacityAtlasAuditCore"
globs = ["CapacityAtlasAuditCore.*"]

[[lean_lib]]
name = "CapacityAtlasAuditTests"
globs = ["CapacityAtlasAuditTests.*"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"
