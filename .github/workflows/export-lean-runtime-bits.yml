name: Export Lean runtime artifact IDs

on:
  push:
    branches:
      - agent/audit-and-complete-bsc

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-manifest]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/audit-and-complete-bsc
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          use-mathlib-cache: false
      - name: Package dereferenced runtime
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN_ROOT="$(cd "$(dirname "$LEAN_BIN")/.." && pwd -P)"
          mkdir -p "$RUNNER_TEMP/runtime"
          cp -aL "$TOOLCHAIN_ROOT/." "$RUNNER_TEMP/runtime/"
          tar --zstd -cf "$RUNNER_TEMP/lean-runtime.tar.zst" -C "$RUNNER_TEMP" runtime
          split -b 300M -d -a 2 "$RUNNER_TEMP/lean-runtime.tar.zst" "$RUNNER_TEMP/lean-runtime.part-"
          test -f "$RUNNER_TEMP/lean-runtime.part-00"
          test ! -f "$RUNNER_TEMP/lean-runtime.part-04"
      - id: p0
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-bits-00
          path: ${{ runner.temp }}/lean-runtime.part-00
          compression-level: 0
          retention-days: 1
      - id: p1
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-bits-01
          path: ${{ runner.temp }}/lean-runtime.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - id: p2
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-bits-02
          path: ${{ runner.temp }}/lean-runtime.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - id: p3
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-bits-03
          path: ${{ runner.temp }}/lean-runtime.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Commit artifact IDs as bit files
        shell: bash
        env:
          P0: ${{ steps.p0.outputs.artifact-id }}
          P1: ${{ steps.p1.outputs.artifact-id }}
          P2: ${{ steps.p2.outputs.artifact-id }}
          P3: ${{ steps.p3.outputs.artifact-id }}
        run: |
          set -euo pipefail
          rm -rf .ci-runtime
          mkdir -p .ci-runtime
          python - <<'PY'
          import os, pathlib
          root = pathlib.Path('.ci-runtime')
          for a in range(4):
              value = os.environ.get(f'P{a}', '')
              if not value:
                  continue
              n = int(value)
              (root / f'a{a}-present').touch()
              for bit in range(40):
                  if (n >> bit) & 1:
                      (root / f'a{a}-bit-{bit}').touch()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-runtime
          git commit -m '[runtime-manifest] encode Lean artifact IDs'
          git push origin HEAD:agent/audit-and-complete-bsc
