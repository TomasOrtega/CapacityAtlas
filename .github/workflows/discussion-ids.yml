name: Discover discussion IDs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  discussions: read

jobs:
  discover:
    if: github.head_ref == 'agent/discussions-ui-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Query repository and discussion categories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query {
            repository(owner: "TomasOrtega", name: "CapacityAtlas") {
              id
              discussionCategories(first: 25) {
                nodes { id name isAnswerable }
              }
            }
          }'
      - name: Verify giscus access
        run: |
          curl --fail-with-body --silent --show-error \
            'https://giscus.app/api/discussions/categories?repo=TomasOrtega%2FCapacityAtlas'
          echo
