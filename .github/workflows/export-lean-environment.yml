name: Export Lean environment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: export-capacity-atlas-lean-environment
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/audit-and-complete-bsc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          use-mathlib-cache: true
      - name: Package and split source, dependencies, and toolchain
        run: |
          mkdir -p .lean-env-parts
          tar --zstd -cf "$RUNNER_TEMP/capacity-atlas-lean-env.tar.zst" \
            -C "$GITHUB_WORKSPACE" lean \
            -C "$HOME/.elan/toolchains" leanprover--lean4---v4.32.0
          split -b 450M -d -a 2 \
            "$RUNNER_TEMP/capacity-atlas-lean-env.tar.zst" \
            .lean-env-parts/part-
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-00') != '' }}
        with: {name: capacity-atlas-lean-env-00, path: .lean-env-parts/part-00, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-01') != '' }}
        with: {name: capacity-atlas-lean-env-01, path: .lean-env-parts/part-01, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-02') != '' }}
        with: {name: capacity-atlas-lean-env-02, path: .lean-env-parts/part-02, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-03') != '' }}
        with: {name: capacity-atlas-lean-env-03, path: .lean-env-parts/part-03, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-04') != '' }}
        with: {name: capacity-atlas-lean-env-04, path: .lean-env-parts/part-04, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-05') != '' }}
        with: {name: capacity-atlas-lean-env-05, path: .lean-env-parts/part-05, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-06') != '' }}
        with: {name: capacity-atlas-lean-env-06, path: .lean-env-parts/part-06, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-07') != '' }}
        with: {name: capacity-atlas-lean-env-07, path: .lean-env-parts/part-07, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-08') != '' }}
        with: {name: capacity-atlas-lean-env-08, path: .lean-env-parts/part-08, compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('.lean-env-parts/part-09') != '' }}
        with: {name: capacity-atlas-lean-env-09, path: .lean-env-parts/part-09, compression-level: 0, retention-days: 1}
