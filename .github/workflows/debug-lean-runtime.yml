name: Diagnose Lean runtime export

on:
  push:
    branches:
      - agent/audit-and-complete-bsc

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-debug]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/audit-and-complete-bsc
      - name: Diagnose
        shell: bash
        run: |
          set +e
          : > .ci-runtime-debug
          echo START=1 >> .ci-runtime-debug
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          echo CURL=$? >> .ci-runtime-debug
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.32.0
          echo INSTALL=$? >> .ci-runtime-debug
          export PATH="$HOME/.elan/bin:$PATH"
          elan which lean > "$RUNNER_TEMP/which.txt" 2>&1
          echo WHICH=$? >> .ci-runtime-debug
          LEAN_BIN="$(cat "$RUNNER_TEMP/which.txt")"
          printf 'LEAN_BIN=%s\n' "$LEAN_BIN" >> .ci-runtime-debug
          LEAN_REAL="$(readlink -f "$LEAN_BIN" 2>/dev/null)"
          echo READLINK=$? >> .ci-runtime-debug
          printf 'LEAN_REAL=%s\n' "$LEAN_REAL" >> .ci-runtime-debug
          if test -x "$LEAN_REAL"; then echo REAL_EXEC=1 >> .ci-runtime-debug; else echo REAL_EXEC=0 >> .ci-runtime-debug; fi
          if test -n "$LEAN_REAL"; then
            TOOLCHAIN_ROOT="$(cd "$(dirname "$LEAN_REAL")/.." 2>/dev/null && pwd -P)"
          else
            TOOLCHAIN_ROOT=""
          fi
          printf 'TOOLCHAIN_ROOT=%s\n' "$TOOLCHAIN_ROOT" >> .ci-runtime-debug
          if test -d "$TOOLCHAIN_ROOT"; then echo ROOT_DIR=1 >> .ci-runtime-debug; else echo ROOT_DIR=0 >> .ci-runtime-debug; fi
          if test -d "$TOOLCHAIN_ROOT"; then du -sm "$TOOLCHAIN_ROOT" | awk '{print "ROOT_MB=" $1}' >> .ci-runtime-debug; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-runtime-debug
          git commit -m '[runtime-debug] record Lean runtime diagnostics'
          git push origin HEAD:agent/audit-and-complete-bsc
