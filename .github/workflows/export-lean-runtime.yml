name: Export dereferenced Lean runtime

on:
  push:
    branches:
      - agent/audit-and-complete-bsc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          use-mathlib-cache: true
      - name: Package dereferenced runtime
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN_ROOT="$(cd "$(dirname "$LEAN_BIN")/.." && pwd -P)"
          mkdir -p "$RUNNER_TEMP/runtime"
          cp -aL "$TOOLCHAIN_ROOT/." "$RUNNER_TEMP/runtime/"
          tar --zstd -cf "$RUNNER_TEMP/lean-runtime.tar.zst" -C "$RUNNER_TEMP" runtime
          split -b 450M -d -a 2 "$RUNNER_TEMP/lean-runtime.tar.zst" "$RUNNER_TEMP/lean-runtime.part-"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-00
          path: ${{ runner.temp }}/lean-runtime.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-01
          path: ${{ runner.temp }}/lean-runtime.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-02
          path: ${{ runner.temp }}/lean-runtime.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-03
          path: ${{ runner.temp }}/lean-runtime.part-03
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-04
          path: ${{ runner.temp }}/lean-runtime.part-04
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-05
          path: ${{ runner.temp }}/lean-runtime.part-05
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
