name: Export Lean runtime manifest v2

on:
  push:
    branches:
      - agent/audit-and-complete-bsc
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          use-mathlib-cache: false
      - name: Package dereferenced runtime
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$(elan which lean)"
          TOOLCHAIN_ROOT="$(cd "$(dirname "$LEAN_BIN")/.." && pwd -P)"
          mkdir -p "$RUNNER_TEMP/runtime"
          cp -aL "$TOOLCHAIN_ROOT/." "$RUNNER_TEMP/runtime/"
          tar --zstd -cf "$RUNNER_TEMP/lean-runtime.tar.zst" -C "$RUNNER_TEMP" runtime
          split -b 300M -d -a 2 "$RUNNER_TEMP/lean-runtime.tar.zst" "$RUNNER_TEMP/lean-runtime.part-"
          test -f "$RUNNER_TEMP/lean-runtime.part-00"
          test ! -f "$RUNNER_TEMP/lean-runtime.part-04"
      - id: p0
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-v2-00
          path: ${{ runner.temp }}/lean-runtime.part-00
          compression-level: 0
          retention-days: 1
      - id: p1
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-v2-01
          path: ${{ runner.temp }}/lean-runtime.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - id: p2
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-v2-02
          path: ${{ runner.temp }}/lean-runtime.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - id: p3
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-v2-03
          path: ${{ runner.temp }}/lean-runtime.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Write artifact manifest
        shell: bash
        env:
          P0: ${{ steps.p0.outputs.artifact-id }}
          P1: ${{ steps.p1.outputs.artifact-id }}
          P2: ${{ steps.p2.outputs.artifact-id }}
          P3: ${{ steps.p3.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json, os
          ids = [os.environ.get(f'P{i}', '') for i in range(4)]
          ids = [int(x) for x in ids if x]
          with open(os.environ['RUNNER_TEMP'] + '/lean-runtime-manifest.json', 'w') as f:
              json.dump({'artifact_ids': ids}, f)
          PY
      - id: manifest
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-v2-manifest
          path: ${{ runner.temp }}/lean-runtime-manifest.json
          retention-days: 1
      - name: Encode manifest artifact ID as PR labels
        uses: actions/github-script@v8
        env:
          MANIFEST_ID: ${{ steps.manifest.outputs.artifact-id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = 20;
            const id = BigInt(process.env.MANIFEST_ID);
            const existing = await github.paginate(github.rest.issues.listLabelsOnIssue,
              {owner, repo, issue_number, per_page: 100});
            for (const label of existing) {
              if (label.name.startsWith('lean-manifest-bit-')) {
                await github.rest.issues.removeLabel({owner, repo, issue_number, name: label.name});
              }
            }
            const labels = [];
            for (let bit = 0; bit < 40; bit++) {
              if (((id >> BigInt(bit)) & 1n) === 1n) {
                const name = `lean-manifest-bit-${bit}`;
                try {
                  await github.rest.issues.createLabel({owner, repo, name, color: '0e8a16'});
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                labels.push(name);
              }
            }
            await github.rest.issues.addLabels({owner, repo, issue_number, labels});
