name: Site, Lean, and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Validate and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Run prek
        run: uv run --locked prek -a --quiet
      - name: Validate registry
        run: uv run --locked capacity-atlas validate
      - name: Test
        run: uv run --locked pytest
      - name: Build production site
        run: uv run --locked capacity-atlas build
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  lean:
    name: Compile Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject placeholders
        run: |
          if grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' \
              lean/CapacityAtlas lean/CapacityAtlas.lean \
              lean/CapacityAtlasForMathlib lean/CapacityAtlasForMathlib.lean \
              lean/CapacityAtlasUtil lean/CapacityAtlasUtil.lean; then
            echo 'Lean placeholders are not permitted.' >&2
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          use-mathlib-cache: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [site, lean]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
