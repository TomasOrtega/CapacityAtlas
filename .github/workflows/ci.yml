name: Site, Lean, and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Validate and build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Run prek
        run: uv run --locked prek -a --quiet
      - name: Validate registry
        run: uv run --locked capacity-atlas validate
      - name: Test
        run: uv run --locked pytest
      - name: Build production site
        run: uv run --locked capacity-atlas build
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  lean:
    name: Compile Lean
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          use-mathlib-cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build trusted Lean layers
        working-directory: lean
        run: lake --wfail build CapacityAtlasForMathlib CapacityAtlasUtil
      - name: Build all Lean declarations
        working-directory: lean
        run: lake --wfail build CapacityAtlas
      - name: Audit transitive Lean trust
        working-directory: lean
        run: lake exe capacity_audit > "$RUNNER_TEMP/capacity-audit.json"
      - name: Validate compiled claim registry
        run: uv run --locked capacity-atlas validate --lean-report "$RUNNER_TEMP/capacity-audit.json"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [site, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
