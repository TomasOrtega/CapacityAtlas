name: Propose a capacity problem
description: Propose a new, precisely specified channel-capacity entry.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: Please use primary sources and distinguish the channel law from the operational problem.
  - type: input
    id: title
    attributes:
      label: Problem title
      placeholder: Binary deletion channel capacity
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Exact channel model
      description: Include alphabets, transition law, memory, feedback, state information, constraints, and code class.
    validations:
      required: true
  - type: textarea
    id: quantity
    attributes:
      label: Operational quantity and criterion
      description: State the capacity notion, error criterion, and rate normalization.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Known answer or best bounds
      description: Give exact formulas or separate lower and upper bounds with assumptions.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Provide durable links, theorem numbers, and a sentence explaining what each source establishes.
    validations:
      required: true
  - type: textarea
    id: frontier
    attributes:
      label: Why this belongs in the atlas
      description: Explain the unresolved gap, historical importance, or formalization value.
