name: Propose a formal claim or proof
description: Coordinate a formal claim or proof repository.
title: "[Formal] "
body:
  - type: input
    id: problem
    attributes:
      label: Capacity Atlas problem ID
      placeholder: sun-jafar-11-message-index-coding
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution type
      options:
        - Shared API or definition
        - Formally stated claim
        - Local proof or test
        - Linked proof repository
    validations:
      required: true
  - type: textarea
    id: declarations
    attributes:
      label: Proposed declarations
      description: Name declarations, module paths, and metadata attributes.
    validations:
      required: true
  - type: textarea
    id: faithfulness
    attributes:
      label: Faithfulness argument
      description: Explain why the proposition matches the model, criterion, and normalization on the page.
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Claim ID and version
      description: Give the stable claim ID and its integer version.
      placeholder: nonlinear-converse v1
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Formal proof provenance
      description: For substantial proofs, give repository, immutable commit, file, declaration, and public CI.
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: Any sorry is confined to a research claim; APIs, tests, and locally proved code contain no sorry or admit.
          required: true
        - label: I agree that submitted software and Lean source are contributed under Apache-2.0.
          required: true
