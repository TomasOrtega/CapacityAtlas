name: Propose a formal claim or proof
description: Coordinate a Lean definition, claim, or proof.
title: "[Formal] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: A proposal is enough. Maintainers can help with registry metadata and repository layout.
  - type: input
    id: problem
    attributes:
      label: Capacity Atlas problem ID
      description: Optional for shared API work.
      placeholder: sun-jafar-11-message-index-coding
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution type
      options:
        - Shared API or definition
        - Formally stated claim
        - Local proof or test
        - Linked proof repository
    validations:
      required: true
  - type: textarea
    id: declarations
    attributes:
      label: What should be formalized?
      description: Describe the definition, statement, proof, or shared API.
    validations:
      required: true
  - type: textarea
    id: faithfulness
    attributes:
      label: Faithfulness or intended use
      description: For a claim, explain why it matches the page. For shared API, explain where it will be used.
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Claim ID and version
      description: Required for an existing registered claim. Otherwise leave blank.
      placeholder: nonlinear-converse v1
  - type: textarea
    id: proof
    attributes:
      label: Formal proof provenance
      description: For substantial proofs, give repository, immutable commit, file, declaration, and public CI.
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: Any sorry is confined to a research claim; APIs, tests, and local proofs contain no sorry or admit.
          required: true
        - label: I agree that submitted software and Lean source are contributed under Apache-2.0.
          required: true
