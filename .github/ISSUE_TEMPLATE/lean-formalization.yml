name: Propose a Lean formalization
description: Coordinate a new or extended Lean 4 contribution.
title: "[Lean] "
body:
  - type: input
    id: problem
    attributes:
      label: Capacity Atlas problem ID
      placeholder: binary-symmetric-channel
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Intended status
      options:
        - Definitions
        - Operational statement
        - Partial proof
        - Complete proof
    validations:
      required: true
  - type: textarea
    id: declarations
    attributes:
      label: Proposed declarations
      description: State the definitions or theorems and the shared modules they reuse.
    validations:
      required: true
  - type: textarea
    id: faithfulness
    attributes:
      label: Faithfulness argument
      description: Explain why the Lean statement matches the model and criterion on the page.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Missing shared infrastructure
      description: Identify entropy, mutual information, block-code, network, or analytic definitions that should be shared.
