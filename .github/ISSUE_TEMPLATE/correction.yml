name: Report a correction or site bug
description: Report a factual, bibliographic, accessibility, or implementation problem.
title: "[Correction] "
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: problems/binary-symmetric-channel or data/problems/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote or describe the current behavior precisely.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction steps
      description: Give a primary source for mathematical corrections or exact steps for software bugs.
