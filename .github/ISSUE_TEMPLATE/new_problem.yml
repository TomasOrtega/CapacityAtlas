name: Propose a capacity problem
description: Add a precisely specified channel-capacity question.
title: "[Problem] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: No YAML is needed. Describe the problem and cite primary sources; maintainers can format the entry and choose tags.
  - type: input
    id: title
    attributes:
      label: Problem title
      placeholder: Binary deletion channel capacity
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Channel model
      description: Include alphabets, transition law, memory, feedback, state information, constraints, and code class.
    validations:
      required: true
  - type: textarea
    id: quantity
    attributes:
      label: Operational quantity and criterion
      description: State the error criterion, rate normalization, and whether the object is a capacity or region.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Known results or bounds
      description: Separate achievability and converse claims and state all assumptions.
    validations:
      required: true
  - type: textarea
    id: tags
    attributes:
      label: Suggested tags
      description: Optional. Choose model, features, quantity, and knowledge values from data/tags.yaml.
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Link each source and identify the relevant theorem, proposition, or section.
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: Contribution license
      options:
        - label: I agree that submitted atlas data and prose are contributed under CC-BY-4.0.
          required: true
