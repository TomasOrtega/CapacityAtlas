name: Add or correct a bound
description: Share a result or source for an existing problem.
title: "[Bound] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: No YAML is needed. Give the exact claim and a primary source; maintainers can update the registry.
  - type: input
    id: problem
    attributes:
      label: Capacity Atlas problem ID
      placeholder: binary-deletion-channel
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Result type
      options:
        - Achievability / lower bound
        - Converse / upper bound
        - Exact result
        - Inner region
        - Outer region
        - Linear-encoder-only exact result
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What does the result say?
      description: Include assumptions, parameter ranges, code class, normalization, error criterion, and method.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary source
      description: Link the source and identify the theorem, proposition, or section.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Why should the entry change?
      description: Briefly compare this result with the current entry. Optional.
