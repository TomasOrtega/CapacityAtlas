name: Suggest a correction
description: Report a factual, reference, accessibility, or site problem.
title: "[Correction] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: No code is needed. Tell us what is wrong and, for mathematical corrections, cite a primary source.
  - type: input
    id: location
    attributes:
      label: Problem, page, or file
      placeholder: binary-symmetric-channel or data/problems/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should it say or do instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source or reproduction steps
      description: Cite a primary source for a mathematical correction. Optional for other reports.
