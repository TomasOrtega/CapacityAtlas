<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page_title|default('') %}{{ page_title }} · {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ page_description|default(site.description) }}">
  <meta name="theme-color" content="#16243a">
  <link rel="canonical" href="{{ site.canonical_url.rstrip('/') }}/{{ request_path|default('') }}">
  <link rel="stylesheet" href="{{ site_url('assets/styles.css') }}">
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="{{ site_url('assets/site.js') }}"></script>
</head>
<body data-page="{{ page_id }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="{{ site_url() }}"><span class="brand__mark">C</span><span><strong>{{ site.name }}</strong><small>Channel-capacity registry</small></span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Primary" data-site-nav>
        <a {% if page_id in ['problems','problem'] %}aria-current="page"{% endif %} href="{{ site_url('problems/') }}">Browse</a>
        <a {% if page_id == 'formalizations' %}aria-current="page"{% endif %} href="{{ site_url('formalizations/') }}">Lean</a>
        <a {% if page_id == 'contribute' %}aria-current="page"{% endif %} href="{{ site_url('contribute/') }}">Contribute</a>
        <a {% if page_id == 'about' %}aria-current="page"{% endif %} href="{{ site_url('about/') }}">About</a>
        <a href="{{ site.repository_url }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>Software and Lean: {{ site.licenses.software }} · Atlas data and prose: {{ site.licenses.content }}</span>
      <span><a href="{{ site_url('api/') }}">API</a> · <a href="{{ site.repository_url }}/discussions">Discussions</a> · <a href="{{ site.repository_url }}/issues">Issues</a></span>
    </div>
  </footer>
</body>
</html>
