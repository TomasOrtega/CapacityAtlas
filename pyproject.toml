[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-atlas"
version = "0.2.0"
description = "Static registry of channel-capacity problems and Lean formalizations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Capacity Atlas Authors" }]
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "beautifulsoup4>=4.12,<5",
  "prek>=0.4,<1",
  "ruff>=0.16,<1",
]

[project.scripts]
capacity-atlas = "capacity_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
