id: seven-cycle-zero-error-channel
title: Seven-cycle zero-error channel
abbreviation: C7
status: open
featured: true
updated: '2026-08-13'
summary: The exact Shannon capacity of the seven-cycle remains unknown between a finite fifth-power certificate and the Lovász theta bound.
tags:
  model: [zero-error]
  features: [finite-alphabet, discrete-memoryless]
  quantity: [zero-error-capacity]
  knowledge: [bounds, regularized-characterization]
model:
  input: Seven symbols indexed cyclically.
  output: Confusability is exactly adjacency in the cycle graph \(C_7\).
  law: Two length-n words are confusable when every coordinate is equal or adjacent in \(C_7\).
  assumptions:
  - Decoding error is exactly zero.
  - Independent uses correspond to strong graph powers.
quantity:
  name: Multiplicative Shannon capacity
  symbol: \Theta(C_7)
  units: zero-error alphabet growth per channel use
  criterion: Supremum of nth roots of zero-error code cardinalities.
capacity:
  kind: bounds
  display: 367^{1/5}\le\Theta(C_7)\le\frac{7\cos(\pi/7)}{1+\cos(\pi/7)}
  lower: 367^{1/5}
  upper: \frac{7\cos(\pi/7)}{1+\cos(\pi/7)}
bounds:
- id: fifth-power-independent-set
  direction: lower
  relation: \Theta(C_7)\ge367^{1/5}
  method: Explicit independent set of size 367 in the fifth strong power.
  year: 2019
  references: [polak-schrijver-2019]
- id: lovasz-theta
  direction: upper
  relation: \Theta(C_7)\le\vartheta(C_7)=\frac{7\cos(\pi/7)}{1+\cos(\pi/7)}
  method: Lovász theta, multiplicative under strong product.
  year: 1979
  references: [lovasz-1979]
frontier:
  question: Determine \(\Theta(C_7)\) exactly or strictly improve either certified endpoint.
  bottleneck: Finite strong-power independent sets and known multiplicative upper bounds leave a persistent gap.
  progress:
  - Verify larger strong-power independent-set certificates.
  - Find an upper parameter below Lovász theta for this graph.
formalization:
  status: stated
  claims:
  - id: capacity-bounds
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: The seven-cycle Shannon capacity lies between 367^(1/5) and 7 cos(π/7)/(1+cos(π/7)).
  notes: Decimal approximations are omitted; the proposition records exact symbolic endpoints.
  files:
  - path: lean/CapacityAtlas/ZeroError/SevenCycle.lean
    declaration: CapacityAtlas.ZeroError.sevenCycleKnownBounds
    role: claim
    description: The seven-cycle Shannon capacity lies between 367^(1/5) and 7 cos(π/7)/(1+cos(π/7)).
    claim_id: capacity-bounds
  proofs: []
references: [shannon-1956, lovasz-1979, polak-schrijver-2019]
