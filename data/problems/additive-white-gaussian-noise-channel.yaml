id: additive-white-gaussian-noise-channel
title: Real additive white Gaussian noise channel
abbreviation: AWGN
status: solved
featured: true
updated: '2026-08-10'
summary: The power-constrained real Gaussian channel has a closed-form capacity attained by a Gaussian input.
tags:
  model:
  - point-to-point
  features:
  - continuous-alphabet
  - gaussian
  - additive-noise
  - power-constraint
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: P
  description: Average input power.
  range: P\ge0
- symbol: N
  description: Noise variance.
  range: N>0
model:
  input: \(X\in\mathbb R\)
  output: \(Y\in\mathbb R\)
  law: \(Y=X+Z\), where \(Z\sim\mathcal N(0,N)\) independently across uses.
  assumptions:
  - The encoder satisfies \(\mathbb E[X^2]\le P\).
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C_{\mathrm{AWGN}}(P,N)
  units: bits per channel use
  criterion: Average-error capacity without feedback.
capacity:
  kind: exact
  display: C_{\mathrm{AWGN}}(P,N)=\frac12\log_2\!\left(1+\frac PN\right)
  notes: A zero-mean Gaussian input of variance P achieves capacity.
bounds:
- id: gaussian-achievability
  direction: lower
  relation: C\ge\frac12\log_2(1+P/N)
  method: Gaussian random coding.
  year: 1948
  references:
  - shannon-1948
- id: entropy-maximization-converse
  direction: upper
  relation: C\le\frac12\log_2(1+P/N)
  method: Gaussian distributions maximize differential entropy at fixed variance.
  year: 1948
  references:
  - shannon-1948
formalization:
  status: none
  claims: []
  notes: Continuous probability and differential entropy are not yet in the shared Lean layer.
  files: []
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
