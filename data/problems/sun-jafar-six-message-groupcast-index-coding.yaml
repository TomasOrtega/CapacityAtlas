id: sun-jafar-six-message-groupcast-index-coding
title: Sun-Jafar six-message groupcast index-coding instance
abbreviation: SJ6-GC
status: open
featured: true
updated: '2026-08-13'
summary: A six-message, ten-receiver groupcast instance has linear-encoder capacity 5/13 and a non-Shannon nonlinear upper bound 11/28.
tags:
  model: [index-coding]
  features: [finite-alphabet, non-shannon, nonlinear-coding]
  quantity: [symmetric-capacity]
  knowledge: [bounds, linear-encoder-only]
model:
  input: Six independent equal-length messages held by one broadcaster.
  output: Ten receivers demand messages \((1,1,2,3,4,5,6,6,6,6)\) in source order.
  law: The one-based interference rows are \(\{2,4\},\{4,5\},\{5\},\varnothing,\varnothing,\{2\},\{1,3\},\{2,3\},\{3,4\},\{3,5\}\).
  assumptions:
  - Messages are uniform, independent, and use one common finite alphabet.
  - Decoding error is exactly zero and arbitrary blocklength nonlinear codes are allowed.
quantity:
  name: Zero-error nonlinear symmetric capacity
  symbol: C_{\mathrm{sym}}
  units: message symbols per broadcast symbol
  criterion: Zero error for every message tuple and receiver, with arbitrary finite alphabet and blocklength.
capacity:
  kind: bounds
  display: \frac5{13}\le C_{\mathrm{sym}}\le\frac{11}{28}
  lower: \frac5{13}
  upper: \frac{11}{28}
  conjectured: \frac5{13}
  notes: Global linear-encoder symmetric capacity is exactly 5/13; Shannon inequalities alone stop at 2/5. The formal
    quantity permits arbitrary zero-error decoders, pending a proof that they may always be chosen linear.
bounds:
- id: vector-linear-code
  direction: lower
  relation: C_{\mathrm{sym}}\ge\frac5{13}
  method: Explicit vector-linear subspace alignment.
  year: 2015
  references: [sun-jafar-2015]
- id: zhang-yeung-converse
  direction: upper
  relation: C_{\mathrm{sym}}\le\frac{11}{28}
  method: Zhang-Yeung non-Shannon information inequality.
  year: 2015
  references: [sun-jafar-2015, zhang-yeung-1998]
- id: linear-encoder-capacity
  direction: linear-encoder-exact
  relation: C_{\mathrm{sym}}^{\mathrm{linear\text{-}enc}}=\frac5{13}
  method: Linear-encoder construction and Ingleton converse.
  year: 2015
  references: [sun-jafar-2015]
frontier:
  question: Prove the nonlinear capacity is 5/13 or construct a zero-error nonlinear code above it.
  bottleneck: Known non-Shannon inequalities improve the converse but do not meet the linear construction.
  progress:
  - Improve either endpoint with an auditable certificate.
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: open
    formal_status: stated
    version: 1
    description: Unrestricted nonlinear zero-error symmetric capacity equals 5/13.
  - id: linear-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 2
    description: Published 5/13 linear-encoder achievability bound.
  - id: unrestricted-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Unrestricted 5/13 lower bound derived from linear-encoder achievability.
  - id: linear-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Global finite-field linear-encoder symmetric capacity is at most 5/13.
  - id: nonlinear-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Unrestricted nonlinear zero-error symmetric capacity is at most 11/28.
  - id: shannon-relaxation-value
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: The Shannon polymatroid relaxation equals 2/5.
  - id: shannon-outer-bound
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Operational 2/5 outer bound derived from the Shannon relaxation.
  - id: interference-translation
    kind: structural
    category: test
    formal_status: proved
    version: 1
    description: Exact translation of all ten source interference rows.
  notes: Demands and interference rows are machine-checked translations of the one-based primary-source
    figure.
