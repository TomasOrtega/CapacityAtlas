id: degraded-wiretap-channel
title: Degraded discrete memoryless wiretap channel
status: solved
updated: '2026-08-10'
summary: A sender communicates reliably to a legitimate receiver while hiding the message from a degraded eavesdropper.
tags:
  model:
  - wiretap
  features:
  - finite-alphabet
  - discrete-memoryless
  - degraded
  - secrecy
  quantity:
  - secrecy-capacity
  knowledge:
  - exact
  - single-letter-characterization
model:
  input: \(X\in\mathcal X\)
  output: Legitimate output \(Y\) and eavesdropper output \(Z\).
  law: 'The channel is memoryless and physically degraded: \(X\to Y\to Z\).'
  assumptions:
  - Reliability is required at Y.
  - Information leakage to Z vanishes under the stated secrecy criterion.
quantity:
  name: Secrecy capacity
  symbol: C_s
  units: secret bits per channel use
  criterion: Reliable communication with asymptotically vanishing leakage.
capacity:
  kind: characterization
  display: C_s=\max_{P_X}\bigl[I(X;Y)-I(X;Z)\bigr]
  conditions: The channel is physically degraded.
bounds:
- id: random-binning-achievability
  direction: lower
  relation: C_s\ge\max_{P_X}[I(X;Y)-I(X;Z)]
  method: Stochastic encoding and random binning.
  year: 1975
  references:
  - wyner-1975
- id: degraded-secrecy-converse
  direction: upper
  relation: C_s\le\max_{P_X}[I(X;Y)-I(X;Z)]
  method: Fano's inequality, secrecy, and degradedness.
  year: 1975
  references:
  - wyner-1975
formalization:
  status: none
  claims: []
  notes: Secrecy criteria and mutual-information converses are not yet formalized.
  files: []
  proofs: []
references:
- wyner-1975
- elgamal-kim-2011
