id: discrete-memoryless-channel-with-feedback
title: Finite discrete memoryless channel with noiseless feedback
status: solved
updated: '2026-09-11'
summary: Causal noiseless output feedback changes coding strategies and reliability but not ordinary DMC capacity.
tags:
  model: [point-to-point]
  features: [finite-alphabet, discrete-memoryless, feedback]
  quantity: [capacity]
  knowledge: [exact, single-letter-characterization]
model:
  input: At use i the encoder chooses a symbol from a finite nonempty alphabet as a deterministic function of the message and outputs strictly before i.
  output: A symbol from a finite nonempty alphabet is observed by the decoder and fed back noiselessly before the next use.
  law: Conditional on the message and past outputs, the next output has the fixed transition law \(W(y_i\mid x_i)\).
  assumptions:
  - Feedback is noiseless, strictly causal, and unlimited; both terminals know the forward channel law.
  - Blocklengths are fixed in advance, with no variable stopping time.
  - Messages are uniform, encoders and decoders are deterministic, and average decoding error vanishes.
  - There is no input-cost constraint.
quantity:
  name: Feedback capacity
  symbol: C_{\mathrm{fb}}(W)
  units: bits per channel use
  criterion: The supremum of rates supported at every sufficiently large fixed blocklength with vanishing average error and strictly causal output feedback.
capacity:
  kind: exact
  display: C_{\mathrm{fb}}(W)=C(W)=\max_{P_X}I(X;Y)
  notes: Shannon's Theorem 6 proves the ordinary feedback-capacity equality; Theorem 7 concerns the separate zero-error problem. The feedback model and theorem are verified in the Collected Papers reprint, pages 232–234. The formal direct proof inherits the all-sufficiently-large-blocklength guarantee from the ordinary DMC coding theorem.
bounds:
- id: ignore-feedback
  direction: lower
  relation: C_{\mathrm{fb}}\ge C
  method: Embed ordinary DMC codes by choosing the same input word regardless of feedback, preserving rate and error exactly.
  year: 1956
  references: [shannon-1956]
- id: feedback-converse
  direction: upper
  relation: C_{\mathrm{fb}}\le\max_{P_X}I(X;Y)
  method: Each adaptive channel use contributes at most the single-use mutual-information maximum; sum over the block and apply Fano's inequality.
  year: 1956
  references: [shannon-1956]
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: Fixed-blocklength average-error capacity with arbitrary strictly causal noiseless feedback policies equals the ordinary finite-DMC mutual-information maximum.
  notes: The canonical proposition uses the product law induced by each adaptive policy. Ordinary codes embed with identical rate and error; the external converse uses a sequential entropy bound and Fano's inequality.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/Feedback.lean
    declaration: CapacityAtlas.Feedback.Policy
    role: API
    description: Inputs depend on the message-specific policy and outputs strictly before the current use.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/Feedback.lean
    declaration: CapacityAtlas.Feedback.blockChannel
    role: API
    description: Normalized physical output law of each adaptive feedback policy.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/Feedback.lean
    declaration: CapacityAtlas.Feedback.BlockCode
    role: API
    description: Deterministic fixed-length feedback code with a positive message count.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/Feedback.lean
    declaration: CapacityAtlas.Feedback.operationalCapacityBits
    role: API
    description: Average-error capacity over all sufficiently large fixed blocklengths.
  - path: lean/CapacityAtlas/Channels/Feedback.lean
    declaration: CapacityAtlas.Channel.feedbackCapacityStatement
    role: claim
    claim_id: exact-capacity
    description: Canonical ordinary feedback-capacity proposition.
  proofs: []
references: [shannon-1956, cover-thomas-2006]
