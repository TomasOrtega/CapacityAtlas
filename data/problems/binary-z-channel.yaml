id: binary-z-channel
title: Binary Z-channel
abbreviation: Z-channel
status: solved
updated: '2026-09-10'
summary: One binary symbol is transmitted perfectly while the other can flip in only one direction.
tags:
  model:
  - point-to-point
  features:
  - binary
  - finite-alphabet
  - discrete-memoryless
  - asymmetric
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: p
  description: Probability that input 1 is received as 0.
  range: 0\le p\le1
model:
  input: \(X\in\{0,1\}\)
  output: \(Y\in\{0,1\}\)
  law: \(P(Y=0\mid X=0)=1\) and \(P(Y=0\mid X=1)=p\).
  assumptions:
  - Channel uses are independent.
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C_Z(p)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: exact
  display: C_Z(p)=\log_2\!\left(1+(1-p)p^{p/(1-p)}\right)
  conditions: \(0<p<1\), with endpoints by continuity.
  notes: The optimizing input is generally nonuniform.
bounds:
- id: optimized-input-achievability
  direction: lower
  relation: C_Z(p)\ge\log_2\!\left(1+(1-p)p^{p/(1-p)}\right)
  method: Evaluate mutual information at the optimizing Bernoulli input.
  year: 1948
  references:
  - shannon-1948
  - cover-thomas-2006
- id: binary-input-converse
  direction: upper
  relation: C_Z(p)\le\log_2\!\left(1+(1-p)p^{p/(1-p)}\right)
  method: Apply the DMC converse and solve the one-variable maximization.
  year: 1948
  references:
  - shannon-1948
  - cover-thomas-2006
formalization:
  status: stated
  claims:
  - id: information-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: The closed-form single-letter information capacity, including one bit at p=0 and zero at p=1.
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: The closed-form operational vanishing-average-error capacity for every 0 ≤ p ≤ 1.
  - id: optimizing-input
    kind: structural
    category: solved
    formal_status: proved
    version: 1
    description: An explicit Bernoulli input attains capacity, with probability of input 1 equal to
      p^(p/(1-p))/(1+(1-p)p^(p/(1-p))) in the interior.
  notes: The optimization uses a general binary entropy log-partition inequality and its equality case.
    The operational result reuses the finite-DMC coding theorem. Both endpoints are proved directly;
    the explicit input is uniform at p=0 and deterministic at p=1, where every input attains zero capacity.
    The Lean formula uses totalized powers and division to give the stated endpoint values.
  files:
  - path: lean/CapacityAtlas/Channels/Binary.lean
    declaration: CapacityAtlas.Channel.binaryZ
    role: definition
    description: Binary Z-channel as a finite stochastic channel.
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZOptimalInput
    role: definition
    description: Explicit capacity-achieving Bernoulli distribution, including both endpoints.
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZ_informationCapacity
    role: claim
    description: The exact information-capacity formula on the full closed parameter interval.
    claim_id: information-capacity
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZ_operationalCapacity
    role: claim
    description: The exact operational average-error capacity from the finite-DMC coding theorem.
    claim_id: operational-capacity
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZ_optimalInput
    role: claim
    description: The explicit Bernoulli input attains the operational capacity.
    claim_id: optimizing-input
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZ_zero
    role: test
    description: The noiseless endpoint has capacity one and the explicit input is uniform.
  - path: lean/CapacityAtlas/Channels/BinaryZ.lean
    declaration: CapacityAtlas.Channel.binaryZ_one
    role: test
    description: The constant-output endpoint has capacity zero, attained by every input.
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
