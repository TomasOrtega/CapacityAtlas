id: general-two-receiver-broadcast-channel
title: General two-receiver discrete memoryless broadcast channel
status: open
featured: true
updated: '2026-10-12'
summary: The general capacity region remains unknown. A 2026 preprint shows that even the full one-letter
  Marton region can be strictly suboptimal.
tags:
  model:
  - broadcast
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity-region
  knowledge:
  - bounds
model:
  input: One transmitter chooses \(X\in\mathcal X\).
  output: Receivers observe \(Y_1\) and \(Y_2\).
  law: An arbitrary memoryless law \(p(y_1,y_2|x)\).
  assumptions:
  - Each receiver requests a private message.
  - No degradedness or receiver ordering is assumed.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{BC}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average error at both receivers.
capacity:
  kind: bounds
  display: \mathcal R_{\mathrm{Marton}}\subseteq\mathcal C_{\mathrm{BC}}\subseteq\mathcal R_{\mathrm{UV}}
  lower: \mathcal R_{\mathrm{Marton}}
  upper: \mathcal R_{\mathrm{UV}}
  notes: These remain valid bounds. Huang, Liu, and Liu (2026, Theorem 5) exhibit a finite channel where
    a two-letter Marton scheme exceeds the full one-letter Marton region, including its common auxiliary.
bounds:
- id: marton-inner
  direction: inner-region
  relation: \mathcal R_{\mathrm{Marton}}\subseteq\mathcal C
  method: Correlated auxiliaries, random binning, and superposition.
  year: 1979
  references:
  - marton-1979
- id: uv-outer
  direction: outer-region
  relation: \mathcal C\subseteq\mathcal R_{\mathrm{UV}}
  method: A single-letter outer region using two auxiliary variables.
  year: 2007
  references:
  - nair-elgamal-2007
- id: two-letter-marton-separation
  direction: lower
  relation: \exists T,\quad M(T)<\tfrac12 M(T^{\otimes 2})\le C_{\Sigma}(T)
  method: Two-letter Marton coding, certified interval arithmetic, and gradient shaping to remove the input constraint.
  year: 2026
  conditions: The unconstrained finite broadcast channel constructed in Theorem 5, with private messages
    and vanishing average error. Here \(M(T)\) is the full one-letter Marton sum rate and \(C_{\Sigma}(T)\)
    is sum capacity, both in bits per use.
  notes: The ternary base example fixes the input distribution; the unconstrained construction enlarges
    the alphabet. This does not settle binary-input channels.
  references:
  - huang-liu-liu-2026
frontier:
  question: Determine the private-message capacity region of the general two-receiver DMC broadcast channel.
  bottleneck: A capacity characterization must account for gains beyond one-letter Marton coding.
  progress:
  - Huang, Liu, and Liu (2026) establish strict suboptimality of the full one-letter Marton region.
  - Discover a tighter computable outer region.
  subproblems:
  - title: Is the full Marton inner region optimal for every binary-input broadcast channel?
    status: open
    url: https://arxiv.org/abs/2608.19869v1
formalization:
  status: stated
  claims:
  - id: marton-uv-bounds
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: The fixed two-auxiliary Marton inner bound and UV outer bound, with closures.
    bound_ids:
    - marton-inner
    - uv-outer
  - id: marton-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked marton achievability.
    bound_ids:
    - marton-inner
  - id: uv-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked uv converse.
    bound_ids:
    - uv-outer
  notes: Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion.
  files:
  - path: lean/CapacityAtlas/Claims/BroadcastBounds.lean
    declaration: CapacityAtlas.Claims.broadcastBounds
    role: claim
    description: The fixed two-auxiliary Marton inner bound and UV outer bound, with closures.
    claim_id: marton-uv-bounds
  - path: lean/CapacityAtlas/Claims/BroadcastBounds.lean
    declaration: CapacityAtlas.Claims.broadcastMarton
