    claim_id: marton-achievability
  - path: lean/CapacityAtlas/Claims/BroadcastBounds.lean
    declaration: CapacityAtlas.Claims.broadcastUV
    role: claim
    description: Independently tracked uv converse.
    claim_id: uv-converse
  proofs: []
