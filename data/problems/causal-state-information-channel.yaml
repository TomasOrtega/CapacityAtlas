id: causal-state-information-channel
title: DMC with causal state information at the encoder
status: solved
updated: '2026-09-10'
summary: An iid channel state is revealed causally to the encoder but not to the decoder.
tags:
  model: [point-to-point]
  features: [finite-alphabet, discrete-memoryless, causal-state, side-information]
  quantity: [capacity]
  knowledge: [exact, single-letter-characterization]
model:
  input: A symbol \(X_t\in\mathcal X\), chosen as \(X_t=f_t(M,S^t)\), with a finite nonempty alphabet.
  output: The decoder observes only \(Y^n\), with finite nonempty output alphabet \(\mathcal Y\).
  law: The finite state alphabet has law q; conditioned on input and state sequences, outputs are independent with transition \(W(y_t\mid x_t,s_t)\).
  assumptions:
  - States are iid, independent of the message, and revealed to the encoder before choosing the current input.
  - The encoder may use all past and current states, but no future states and no output feedback.
  - The decoder does not know the state sequence; both terminals know the state distribution and channel law.
  - Encoders and decoders are deterministic, messages are uniform, and average decoding error vanishes.
  - There is no input-cost constraint.
quantity:
  name: Shannon-strategy capacity
  symbol: C_{\mathrm{causal}}
  units: bits per channel use
  criterion: The supremum of rates supported at every sufficiently large blocklength with vanishing average error over messages, states, and channel outputs.
capacity:
  kind: characterization
  display: C_{\mathrm{causal}}=\max_{P_U,\,x=f(U,S),\,U\perp S} I(U;Y)
  notes: Equivalently, maximize over distributions on the fixed finite alphabet of functions from states to inputs. The induced strategy channel averages W(y|t(s),s) over q(s). Shannon's unnumbered theorem gives this capacity equivalence; ordinary strategy codes form a subclass of all causal codes.
bounds:
- id: shannon-strategy-achievability
  direction: lower
  relation: C_{\mathrm{causal}}\ge\max_{P_U,\,x=f(U,S),\,U\perp S} I(U;Y)
  method: Embed ordinary DMC codes on the finite strategy alphabet by evaluating each strategy at the current state.
  year: 1958
  references: [shannon-1958]
- id: strategy-converse
  direction: upper
  relation: C_{\mathrm{causal}}\le\max_{P_U,\,x=f(U,S),\,U\perp S} I(U;Y)
  method: Message and past states determine the current strategy; a conditional-entropy bound and Fano inequality bound all history-dependent causal codes.
  year: 1958
  references: [shannon-1958]
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: Operational capacity of arbitrary deterministic causal-state codes equals the information capacity of the finite Shannon-strategy channel.
  notes: The canonical proposition uses prefix-dependent policies, the explicit iid-state block law, and an output-only decoder. It is stated as a proposition definition without adding an admitted theorem or axiom.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/CausalState.lean
    declaration: CapacityAtlas.CausalState.Policy
    role: API
    description: An input may depend on exactly the available past and current state prefix.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/CausalState.lean
    declaration: CapacityAtlas.CausalState.blockChannel
    role: API
    description: Physical block law averaged over iid state words for arbitrary causal policies.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/CausalState.lean
    declaration: CapacityAtlas.CausalState.strategyChannel
    role: API
    description: Finite DMC whose inputs are functions from states to physical input symbols.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/CausalState.lean
    declaration: CapacityAtlas.CausalState.BlockCode
    role: API
    description: Deterministic causal encoder and output-only decoder with a positive message count.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/CausalState.lean
    declaration: CapacityAtlas.CausalState.operationalCapacityBits
    role: API
    description: Vanishing-average-error capacity over all sufficiently large blocklengths.
  - path: lean/CapacityAtlas/Channels/CausalState.lean
    declaration: CapacityAtlas.Channel.causalStateCapacityStatement
    role: claim
    claim_id: exact-capacity
    description: Canonical proposition equating causal operational capacity with strategy information capacity.
  proofs: []
references: [shannon-1958, elgamal-kim-2011]
