id: physically-degraded-broadcast-channel
title: Physically degraded two-receiver broadcast channel
status: solved
updated: '2026-09-14'
summary: One transmitter sends private messages to receivers whose outputs form a degradation chain.
tags:
  model:
  - broadcast
  features:
  - finite-alphabet
  - discrete-memoryless
  - degraded
  quantity:
  - capacity-region
  knowledge:
  - exact
  - single-letter-characterization
model:
  input: \(X\in\mathcal X\)
  output: Receiver outputs \(Y_1\) and \(Y_2\).
  law: A memoryless channel satisfying \(X\to Y_1\to Y_2\).
  assumptions:
  - Receiver 1 is stronger.
  - Each receiver requests a private message.
quantity:
  name: Capacity region
  symbol: \mathcal C
  units: rate pairs in bits per channel use
  criterion: Vanishing average error at both receivers.
capacity:
  kind: region
  display: \mathcal C=\bigcup_{p(u,x)}\{(R_1,R_2):R_1\le I(X;Y_1|U),\ R_2\le I(U;Y_2)\}
  conditions: \(U\to X\to Y_1\to Y_2\).
bounds:
- id: superposition-inner
  direction: inner-region
  relation: R_1\le I(X;Y_1|U),\quad R_2\le I(U;Y_2)
  method: Superposition coding and successive decoding.
  year: 1973
  references:
  - bergmans-1973
- id: degraded-broadcast-converse
  direction: outer-region
  relation: R_1\le I(X;Y_1|U),\quad R_2\le I(U;Y_2)
  method: Single-letter converse exploiting degradation.
  year: 1973
  references:
  - bergmans-1973
formalization:
  status: stated
  claims:
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: The private-message operational region of a degraded finite broadcast channel.
    bound_ids:
    - superposition-inner
    - degraded-broadcast-converse
  notes: Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion.
  files:
  - path: lean/CapacityAtlas/Claims/DegradedBroadcast.lean
    declaration: CapacityAtlas.Claims.degradedBroadcast
    role: claim
    description: The private-message operational region of a degraded finite broadcast channel.
    claim_id: operational-capacity
  proofs: []
references:
- bergmans-1973
- elgamal-kim-2011
