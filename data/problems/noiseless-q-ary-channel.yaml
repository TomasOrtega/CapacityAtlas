id: noiseless-q-ary-channel
title: Noiseless finite-alphabet channel
status: solved
updated: '2026-08-11'
summary: A q-symbol input is reproduced exactly, providing the basic normalization for channel capacity.
tags:
  model:
  - point-to-point
  features:
  - q-ary
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: q
  description: Alphabet size.
  range: q\ge2
model:
  input: \(X\in\{1,\ldots,q\}\)
  output: \(Y=X\)
  law: \(W(y|x)=\mathbf 1\{y=x\}\).
  assumptions:
  - Channel uses are independent.
  - Rates are measured in bits.
quantity:
  name: Shannon capacity
  symbol: C
  units: bits per channel use
  criterion: Zero-error and average-error capacities coincide.
capacity:
  kind: exact
  display: C=\log_2 q
bounds:
- id: uncoded-achievability
  direction: lower
  relation: C\ge\log_2 q
  method: Transmit one q-ary symbol per use.
  year: 1948
  references:
  - shannon-1948
- id: alphabet-converse
  direction: upper
  relation: C\le\log_2 q
  method: There are only q outputs per use.
  year: 1948
  references:
  - shannon-1948
formalization:
  statement:
    status: statement
    version: 1
    language: Lean
    notes: The information-capacity formula is proved by reducing mutual information to input entropy. The operational
      average-error formula follows from the formal finite-channel coding theorem.
    files:
    - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteChannel.lean
      declaration: CapacityAtlas.FiniteChannel.identity
      role: shared-api
      description: Noiseless finite channel.
    - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
      declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
      role: shared-api
      description: Operational average-error capacity defined through block codes and vanishing error.
    - path: lean/CapacityAtlas/Channels/Noiseless.lean
      declaration: CapacityAtlas.Channel.noiseless_informationCapacity
      role: statement
      description: Exact single-letter information capacity of a noiseless finite channel.
    - path: lean/CapacityAtlas/Channels/Noiseless.lean
      declaration: CapacityAtlas.Channel.noiselessCapacityStatement
      role: statement
      description: Canonical operational capacity proposition for q at least two.
    - path: lean/CapacityAtlas/Channels/Noiseless.lean
      declaration: CapacityAtlas.Channel.noiseless_operationalCapacity
      role: short-proof
      description: Operational capacity formula from the finite-channel coding theorem.
    - path: lean/CapacityAtlas/Channels/Noiseless.lean
      declaration: CapacityAtlas.Channel.noiselessCapacityStatement_proof
      role: short-proof
      description: Direct proof of the registered noiseless-channel proposition.
  proofs: []
references:
- shannon-1948
