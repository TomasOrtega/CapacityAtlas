id: two-user-gaussian-mac
title: Two-user Gaussian multiple-access channel
status: solved
updated: '2026-09-14'
summary: Two power-constrained Gaussian users share one receiver, giving an exact pentagonal capacity
  region.
tags:
  model:
  - multiple-access
  features:
  - continuous-alphabet
  - gaussian
  - additive-noise
  - power-constraint
  quantity:
  - capacity-region
  knowledge:
  - exact
parameters:
- symbol: P_1,P_2
  description: User power constraints.
  range: P_1,P_2\ge0
- symbol: N
  description: Noise variance.
  range: N>0
model:
  input: Independent inputs \(X_1,X_2\) with powers \(P_1,P_2\).
  output: \(Y=X_1+X_2+Z\)
  law: \(Z\sim\mathcal N(0,N)\) iid.
  assumptions:
  - Messages are independent.
  - There is no feedback.
  - For user j and every local message m_j, sum_t x_{j,t}(m_j)^2 <= n P_j. There is no averaging over
    messages and no feedback.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{GMAC}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average joint decoding error. Resource averaging is fixed by the explicit model
    assumption below.
capacity:
  kind: region
  display: \left\{\begin{array}{l}R_1\le\frac12\log_2(1+P_1/N),\\R_2\le\frac12\log_2(1+P_2/N),\\R_1+R_2\le\frac12\log_2(1+(P_1+P_2)/N)\end{array}\right\}
bounds:
- id: gaussian-mac-inner
  direction: inner-region
  relation: R_i\le\frac12\log_2(1+P_i/N),\ R_1+R_2\le\frac12\log_2(1+(P_1+P_2)/N)
  method: Independent Gaussian codebooks and joint decoding.
  year: 1971
  references:
  - ahlswede-1971
  - liao-1972
- id: gaussian-mac-outer
  direction: outer-region
  relation: R_i\le\frac12\log_2(1+P_i/N),\ R_1+R_2\le\frac12\log_2(1+(P_1+P_2)/N)
  method: Gaussian entropy maximization in the MAC converse.
  year: 1972
  references:
  - liao-1972
  - elgamal-kim-2011
formalization:
  status: stated
  claims:
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: The Gaussian MAC capacity region under separate maximum-codeword power constraints.
    bound_ids:
    - gaussian-mac-inner
    - gaussian-mac-outer
  notes: 'Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion. Power convention:
    SeparateCodewordPowerAdmissible. No equivalence to another power convention is assumed.'
  files:
  - path: lean/CapacityAtlas/Claims/GaussianMAC.lean
    declaration: CapacityAtlas.Claims.gaussianMAC
    role: claim
    description: The Gaussian MAC capacity region under separate maximum-codeword power constraints.
    claim_id: operational-capacity
  proofs: []
references:
- ahlswede-1971
- liao-1972
- elgamal-kim-2011
