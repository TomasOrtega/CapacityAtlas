id: finite-group-additive-noise-channel
title: Finite-group additive-noise channel
status: solved
updated: '2026-08-13'
summary: A symbol in a finite group is corrupted by independent additive noise with a known distribution.
tags:
  model:
  - point-to-point
  features:
  - finite-alphabet
  - discrete-memoryless
  - additive-noise
  - symmetric
  quantity:
  - capacity
  knowledge:
  - exact
model:
  input: \(X\in G\), where \(G\) is a finite group.
  output: \(Y\in G\)
  law: \(Y=X+Z\), with iid noise \(Z\) independent of \(X\).
  assumptions:
  - The group operation and noise law are known.
  - Logarithms use base 2.
quantity:
  name: Shannon capacity
  symbol: C
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: exact
  display: C=\log_2|G|-H(Z)
  notes: The uniform input achieves capacity.
bounds:
- id: uniform-input
  direction: lower
  relation: C\ge\log_2|G|-H(Z)
  method: Uniform input makes the output uniform.
  year: 1948
  references:
  - shannon-1948
- id: output-entropy-converse
  direction: upper
  relation: C\le\log_2|G|-H(Z)
  method: Bound output entropy by log alphabet size.
  year: 1948
  references:
  - shannon-1948
formalization:
  status: stated
  claims:
  - id: information-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: For any finite additive group and noise law, information capacity is log₂|G|-H(Z).
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: For any finite additive group and noise law, operational capacity is log₂|G|-H(Z).
  notes: Translation equivalences prove that every row has the noise entropy and that uniform input produces
    uniform output. The operational formula follows from the formal finite-channel coding theorem.
  files:
  - path: lean/CapacityAtlas/Channels/AdditiveNoise.lean
    declaration: CapacityAtlas.Channel.additiveNoise
    role: definition
    description: Additive-noise channel on an arbitrary finite additive group.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
    declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
    role: API
    description: Operational average-error capacity defined through block codes and vanishing error.
  - path: lean/CapacityAtlas/Channels/AdditiveNoise.lean
    declaration: CapacityAtlas.Channel.additiveNoise_informationCapacity
    role: claim
    description: For any finite additive group and noise law, information capacity is log₂|G|-H(Z).
    claim_id: information-capacity
  - path: lean/CapacityAtlas/Channels/AdditiveNoise.lean
    declaration: CapacityAtlas.Channel.additiveNoise_operationalCapacity
    role: claim
    description: For any finite additive group and noise law, operational capacity is log₂|G|-H(Z).
    claim_id: operational-capacity
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
