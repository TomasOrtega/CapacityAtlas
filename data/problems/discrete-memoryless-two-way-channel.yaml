id: discrete-memoryless-two-way-channel
title: Discrete memoryless two-way channel
status: open
updated: '2026-09-14'
summary: Two terminals exchange messages while adapting each input to their own past observations.
tags:
  model:
  - two-way
  features:
  - finite-alphabet
  - discrete-memoryless
  - feedback
  quantity:
  - capacity-region
  knowledge:
  - bounds
model:
  input: Terminal i chooses \(X_{i,t}\) from its message and past observations.
  output: Terminals receive \(Y_{1,t}\) and \(Y_{2,t}\).
  law: A memoryless law \(p(y_1,y_2|x_1,x_2)\).
  assumptions:
  - Encoding is interactive and causal.
  - Messages are independent.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{TWC}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average error in both directions.
capacity:
  kind: bounds
  display: \mathcal R_{\mathrm{Shannon,in}}\subseteq\mathcal C_{\mathrm{TWC}}\subseteq\mathcal R_{\mathrm{Shannon,out}}
  notes: The bounds coincide for several symmetric or decomposable channels.
bounds:
- id: shannon-two-way-inner
  direction: inner-region
  relation: \mathcal R_{\mathrm{in}}\subseteq\mathcal C
  method: Independent stationary inputs without adaptation.
  year: 1961
  references:
  - shannon-1961
- id: shannon-two-way-outer
  direction: outer-region
  relation: \mathcal C\subseteq\mathcal R_{\mathrm{out}}
  method: Allow arbitrary correlated inputs in a cut-style single-letter outer bound.
  year: 1961
  references:
  - shannon-1961
frontier:
  question: Determine when interaction enlarges the two-way capacity region and characterize the general
    region.
  bottleneck: The terminals create input dependence dynamically through noisy observations, which is difficult
    to summarize by a single-letter distribution.
  progress:
  - Find a sharper dependence-aware converse.
  - Close an explicit channel where Shannon's bounds differ.
formalization:
  status: stated
  claims:
  - id: shannon-inner-outer
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: Shannon's fixed nonadaptive inner region and adaptive outer region.
    bound_ids:
    - shannon-two-way-inner
    - shannon-two-way-outer
  - id: shannon-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked shannon achievability.
    bound_ids:
    - shannon-two-way-inner
  - id: shannon-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked shannon converse.
    bound_ids:
    - shannon-two-way-outer
  notes: Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion.
  files:
  - path: lean/CapacityAtlas/Claims/TwoWayBounds.lean
    declaration: CapacityAtlas.Claims.twoWayBounds
    role: claim
    description: Shannon's fixed nonadaptive inner region and adaptive outer region.
    claim_id: shannon-inner-outer
  - path: lean/CapacityAtlas/Claims/TwoWayBounds.lean
    declaration: CapacityAtlas.Claims.twoWayShannonInner
    role: claim
    description: Independently tracked shannon achievability.
    claim_id: shannon-achievability
  - path: lean/CapacityAtlas/Claims/TwoWayBounds.lean
    declaration: CapacityAtlas.Claims.twoWayShannonOuter
    role: claim
    description: Independently tracked shannon converse.
    claim_id: shannon-converse
  proofs: []
references:
- shannon-1961
- hekstra-willems-1989
- elgamal-kim-2011
