id: multiple-access-channel-with-feedback
title: Discrete memoryless multiple-access channel with feedback
status: open
updated: '2026-09-14'
summary: Common noiseless output feedback lets distributed encoders cooperate, but the general capacity
  region is unknown.
tags:
  model:
  - multiple-access
  features:
  - finite-alphabet
  - discrete-memoryless
  - feedback
  quantity:
  - capacity-region
  knowledge:
  - bounds
model:
  input: Each encoder chooses \(X_{i,t}\) from its message and common past outputs \(Y^{t-1}\).
  output: A common receiver observes \(Y_t\), which is fed back noiselessly.
  law: A memoryless law \(p(y|x_1,x_2)\).
  assumptions:
  - Messages are independent.
  - Feedback is causal, common, and noiseless.
quantity:
  name: Feedback capacity region
  symbol: \mathcal C_{\mathrm{MAC,fb}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average joint decoding error.
capacity:
  kind: bounds
  display: \mathcal R_{\mathrm{CL}}\subseteq\mathcal C_{\mathrm{MAC,fb}}\subseteq\mathcal R_{\mathrm{DB}}
  lower: \mathcal R_{\mathrm{CL}}
  upper: \mathcal R_{\mathrm{DB}}
bounds:
- id: cover-leung-inner
  direction: inner-region
  relation: \mathcal R_{\mathrm{CL}}\subseteq\mathcal C
  method: Block-Markov coding turns past messages into cooperative common information.
  year: 1981
  references:
  - cover-leung-1981
- id: dependence-balance-outer
  direction: outer-region
  relation: \mathcal C\subseteq\mathcal R_{\mathrm{DB}}
  method: Feedback-created encoder dependence must satisfy a dependence-balance constraint.
  year: 1989
  references:
  - hekstra-willems-1989
frontier:
  question: Determine the capacity region of the general DM-MAC with common output feedback.
  bottleneck: Feedback creates useful correlation between independent encoders, but neither block-Markov
    inner bounds nor dependence-balance converses are universally tight.
  progress:
  - Close the gap for a new explicit finite channel.
  - Strengthen dependence balance without losing computability.
formalization:
  status: stated
  claims:
  - id: cover-leung-dependence-balance
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: Cover--Leung achievability and dependence balance for a common-output finite feedback
      MAC.
    bound_ids:
    - cover-leung-inner
    - dependence-balance-outer
  - id: cover-leung-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked cover leung achievability.
    bound_ids:
    - cover-leung-inner
  - id: dependence-balance-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked dependence balance converse.
    bound_ids:
    - dependence-balance-outer
  notes: New statements await mathematical review and proofs.
  files:
  - path: lean/CapacityAtlas/Claims/MACFeedbackBounds.lean
    declaration: CapacityAtlas.Claims.macFeedbackBounds
    role: claim
    description: Cover--Leung achievability and dependence balance for a common-output finite feedback
      MAC.
    claim_id: cover-leung-dependence-balance
  - path: lean/CapacityAtlas/Claims/MACFeedbackBounds.lean
    declaration: CapacityAtlas.Claims.macFeedbackCoverLeung
    role: claim
    description: Independently tracked cover leung achievability.
    claim_id: cover-leung-achievability
  - path: lean/CapacityAtlas/Claims/MACFeedbackBounds.lean
    declaration: CapacityAtlas.Claims.macFeedbackDependenceBalance
    role: claim
    description: Independently tracked dependence balance converse.
    claim_id: dependence-balance-converse
  proofs: []
references:
- cover-leung-1981
- hekstra-willems-1989
- elgamal-kim-2011
