id: general-relay-channel
title: General discrete memoryless relay channel
status: open
featured: true
updated: '2026-09-14'
summary: A causal relay assists a source, but decode-forward and the cut-set bound do not coincide in
  general.
tags:
  model:
  - relay
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity
  knowledge:
  - bounds
model:
  input: Source input \(X\) and relay input \(X_r\).
  output: Relay observation \(Y_r\) and destination observation \(Y\).
  law: A memoryless law \(p(y,y_r\mid x,x_r)\).
  assumptions:
  - The relay acts causally on past observations.
  - Average decoding error vanishes.
quantity:
  name: Shannon capacity
  symbol: C
  units: bits per channel use
  criterion: Average-error source-to-destination capacity.
capacity:
  kind: bounds
  display: R_{\mathrm{DF}}\le C\le R_{\mathrm{cut}}
  lower: \max_{p(x,x_r)}\min\{I(X;Y_r|X_r),I(X,X_r;Y)\}
  upper: \max_{p(x,x_r)}\min\{I(X;Y,Y_r|X_r),I(X,X_r;Y)\}
  notes: The bounds coincide for important subclasses but not for the unrestricted model.
bounds:
- id: decode-forward
  direction: lower
  relation: C\ge R_{\mathrm{DF}}
  method: The relay decodes and cooperatively forwards the message.
  year: 1979
  references:
  - cover-elgamal-1979
- id: cut-set
  direction: upper
  relation: C\le R_{\mathrm{cut}}
  method: Apply a converse across each source-destination cut.
  year: 1979
  references:
  - cover-elgamal-1979
- id: compress-forward
  direction: lower
  relation: C\ge R_{\mathrm{CF}}
  method: Compress-and-forward with I(Z;Zhat|R,Y) <= I(R;Y), product source/relay input distributions.
  year: 1979
  references:
  - cover-elgamal-1979
frontier:
  question: Find a computable exact capacity characterization for the unrestricted relay channel.
  bottleneck: A relay can mix decoding, compression, and coherent cooperation across blocks, while standard
    cut arguments discard causal structure.
  progress:
  - Identify a new subclass where inner and outer bounds coincide.
  - Strengthen the converse using relay causality.
  - Formalize the causal relay code model and cut-set theorem.
formalization:
  status: stated
  claims:
  - id: df-cf-cut-set
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: Decode-and-forward and compress-and-forward are lower bounds, cut set is an upper bound.
    bound_ids:
    - decode-forward
    - compress-forward
    - cut-set
  - id: decode-forward-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked decode forward achievability.
    bound_ids:
    - decode-forward
  - id: compress-forward-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked compress forward achievability.
    bound_ids:
    - compress-forward
  - id: cut-set-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked cut set converse.
    bound_ids:
    - cut-set
  notes: Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion.
  files:
  - path: lean/CapacityAtlas/Claims/RelayBounds.lean
    declaration: CapacityAtlas.Claims.relayBounds
    role: claim
    description: Decode-and-forward and compress-and-forward are lower bounds, cut set is an upper bound.
    claim_id: df-cf-cut-set
  - path: lean/CapacityAtlas/Claims/RelayBounds.lean
    declaration: CapacityAtlas.Claims.relayDecodeForward
    role: claim
    description: Independently tracked decode forward achievability.
    claim_id: decode-forward-achievability
  - path: lean/CapacityAtlas/Claims/RelayBounds.lean
    declaration: CapacityAtlas.Claims.relayCompressForward
    role: claim
    description: Independently tracked compress forward achievability.
    claim_id: compress-forward-achievability
  - path: lean/CapacityAtlas/Claims/RelayBounds.lean
    declaration: CapacityAtlas.Claims.relayCutSet
    role: claim
    description: Independently tracked cut set converse.
    claim_id: cut-set-converse
  proofs: []
references:
- cover-elgamal-1979
- elgamal-kim-2011
