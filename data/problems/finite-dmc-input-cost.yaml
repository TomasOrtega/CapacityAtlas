id: finite-dmc-input-cost
title: Finite discrete memoryless channel with input cost
status: solved
updated: '2026-09-10'
summary: A finite DMC under a feasible maximum-codeword average-cost constraint has a constrained mutual-information capacity formula.
tags:
  model: [point-to-point]
  features: [finite-alphabet, discrete-memoryless]
  quantity: [capacity]
  knowledge: [exact, single-letter-characterization]
model:
  input: Symbols in a finite alphabet \(\mathcal X\), with cost \(c(x)\ge0\).
  output: Symbols in a finite alphabet \(\mathcal Y\).
  law: A stationary memoryless transition law \(W(y\mid x)\).
  assumptions:
  - Every codeword has average input cost at most \(\Gamma\).
  - At least one input symbol has cost at most \(\Gamma\).
  - Messages are uniform and average decoding error vanishes.
quantity:
  name: Cost-constrained capacity
  symbol: C(\Gamma)
  units: bits per channel use
  criterion: Arbitrary blocklength deterministic codes with maximum-codeword cost and vanishing average error.
capacity:
  kind: characterization
  display: C(\Gamma)=\max_{P_X:\,\mathbb E[c(X)]\le\Gamma} I(X;Y)
bounds:
- id: constrained-coding-theorem
  direction: exact
  relation: C(\Gamma)=\max_{P_X:\,\mathbb E[c(X)]\le\Gamma}I(X;Y)
  method: Cost-constrained channel coding theorem and convex optimization.
  year: 2015
  references: [sutter-et-al-2015, kostina-verdu-2015]
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: For nonnegative cost with a feasible symbol, maximum-codeword-cost operational capacity
      equals constrained information capacity.
  notes: The linked certificate proves the unchanged operational claim using cost-controlled random
    coding and a finite-mixture converse. It covers the minimum feasible budget and proves that an
    admissible input attains the information supremum. Its complete build and transitive axiom audit
    run in the proof repository; the local canonical declaration remains stated independently.
  files:
  - path: lean/CapacityAtlas/Channels/InputCost.lean
    declaration: CapacityAtlas.FiniteChannel.finiteDMCInputCostCapacityStatement
    role: claim
    description: For nonnegative cost with a feasible symbol, maximum-codeword-cost operational capacity
      equals constrained information capacity.
    claim_id: exact-capacity
  proofs:
  - id: input-cost-capacity-certificate
    claim_id: exact-capacity
    status: complete
    system: Lean
