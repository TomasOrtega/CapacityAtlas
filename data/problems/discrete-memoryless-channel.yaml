id: discrete-memoryless-channel
title: Finite discrete memoryless channel
abbreviation: DMC
status: solved
featured: true
updated: '2026-08-10'
summary: The general finite memoryless point-to-point channel has a single-letter mutual-information capacity formula.
tags:
  model:
  - point-to-point
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity
  knowledge:
  - exact
  - single-letter-characterization
model:
  input: \(X\in\mathcal X\), with finite \(\mathcal X\).
  output: \(Y\in\mathcal Y\), with finite \(\mathcal Y\).
  law: A stochastic matrix \(W(y\mid x)\), used independently at each channel use.
  assumptions:
  - The channel law is known to encoder and decoder.
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C(W)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: characterization
  display: C(W)=\max_{P_X} I(X;Y)
  notes: The maximum is over distributions on the finite input alphabet.
bounds:
- id: random-coding-achievability
  direction: lower
  relation: C(W)\ge\max_{P_X}I(X;Y)
  method: Random coding and typical decoding.
  year: 1948
  references:
  - shannon-1948
- id: fano-converse
  direction: upper
  relation: C(W)\le\max_{P_X}I(X;Y)
  method: Fano's inequality, the chain rule, and memorylessness.
  year: 1948
  references:
  - shannon-1948
timeline:
- year: 1948
  event: Shannon proved the noisy-channel coding theorem.
  references:
  - shannon-1948
formalization:
  statement:
    status: definitions
    version: 1
    language: Lean
    notes: Shared finite stochastic channels and one-shot codes are formalized. The asymptotic coding theorem is
      not.
    files:
    - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteChannel.lean
      declaration: CapacityAtlas.FiniteChannel
      role: shared-api
      description: Finite stochastic-channel structure.
    - path: lean/CapacityAtlasForMathlib/InformationTheory/Code.lean
      declaration: CapacityAtlas.OneShotCode
      role: shared-api
      description: One-shot encoder, decoder, and error definitions.
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
