id: discrete-memoryless-channel
title: Finite discrete memoryless channel
abbreviation: DMC
status: solved
featured: true
updated: '2026-08-13'
summary: The general finite memoryless point-to-point channel has a single-letter mutual-information capacity formula.
tags:
  model:
  - point-to-point
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity
  knowledge:
  - exact
  - single-letter-characterization
model:
  input: \(X\in\mathcal X\), with finite \(\mathcal X\).
  output: \(Y\in\mathcal Y\), with finite \(\mathcal Y\).
  law: A stochastic matrix \(W(y\mid x)\), used independently at each channel use.
  assumptions:
  - The channel law is known to encoder and decoder.
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C(W)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: characterization
  display: C(W)=\max_{P_X} I(X;Y)
  notes: The maximum is over distributions on the finite input alphabet.
bounds:
- id: random-coding-achievability
  direction: lower
  relation: C(W)\ge\max_{P_X}I(X;Y)
  method: Random coding and typical decoding.
  year: 1948
  references:
  - shannon-1948
- id: fano-converse
  direction: upper
  relation: C(W)\le\max_{P_X}I(X;Y)
  method: Fano's inequality, the chain rule, and memorylessness.
  year: 1948
  references:
  - shannon-1948
timeline:
- year: 1948
  event: Shannon proved the noisy-channel coding theorem.
  references:
  - shannon-1948
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 1
    description: For every finite channel, operational vanishing-average-error capacity equals single-letter
      information capacity.
  notes: The finite-channel coding theorem is proved locally from a threshold random-coding argument and
    a weak Fano converse. The proof covers every finite channel, including the repository's empty-input
    convention.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteChannel.lean
    declaration: CapacityAtlas.FiniteChannel
    role: API
    description: Finite stochastic-channel structure.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/Code.lean
    declaration: CapacityAtlas.OneShotCode
    role: API
    description: One-shot encoder, decoder, and error definitions.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteDistribution.lean
    declaration: CapacityAtlas.FiniteDistribution
    role: API
    description: Finite probability distributions and entropy in nats and bits.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteChannelCapacity.lean
    declaration: CapacityAtlas.FiniteChannel.informationCapacityBits
    role: API
    description: Mutual information and single-letter information capacity.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
    declaration: CapacityAtlas.FiniteChannel.BlockCode
    role: API
    description: Deterministic block codes for memoryless product channels.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
    declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
    role: API
    description: Operational capacity through achievable rates and vanishing average error.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/InformationDensity.lean
    declaration: CapacityAtlas.FiniteChannel.blockInformationDensity_lowerTail_le
    role: API
    description: Product information-density variance and the finite Chebyshev lower-tail estimate.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/RandomCoding.lean
