id: q-ary-symmetric-channel
title: q-ary symmetric channel
abbreviation: q-SC
status: solved
updated: '2026-08-11'
summary: A q-ary symbol is correct with probability 1-p and otherwise changes uniformly to another symbol.
tags:
  model:
  - point-to-point
  features:
  - q-ary
  - finite-alphabet
  - discrete-memoryless
  - symmetric
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: q
  description: Alphabet size.
  range: q\ge2
- symbol: p
  description: Total crossover probability.
  range: 0\le p\le(q-1)/q
model:
  input: \(X\in\{1,\ldots,q\}\)
  output: \(Y\in\{1,\ldots,q\}\)
  law: \(P(Y=X)=1-p\); conditioned on an error, the \(q-1\) other symbols are equiprobable.
  assumptions:
  - Channel uses are independent.
  - The parameter range uses the usual monotone-noise convention.
quantity:
  name: Shannon capacity
  symbol: C_q(p)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: exact
  display: C_q(p)=\log_2 q-h_2(p)-p\log_2(q-1)
  notes: The uniform input achieves capacity.
bounds:
- id: uniform-qary-achievability
  direction: lower
  relation: C_q(p)\ge\log_2 q-h_2(p)-p\log_2(q-1)
  method: Uniform input and the DMC coding theorem.
  year: 1948
  references:
  - shannon-1948
- id: weakly-symmetric-converse
  direction: upper
  relation: C_q(p)\le\log_2 q-h_2(p)-p\log_2(q-1)
  method: The converse for weakly symmetric channels.
  year: 1948
  references:
  - shannon-1948
  - cover-thomas-2006
formalization:
  statement:
    status: statement
    version: 1
    language: Lean
    notes: The channel is constructed as additive noise on ZMod q. Its noise entropy is proved to be binary entropy plus
      p times log(q-1), and the operational formula follows from the finite-group result and coding theorem.
    files:
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetricNoise
      role: definition
      description: Symmetric noise distribution on the cyclic q-symbol alphabet.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetric
      role: definition
      description: q-ary symmetric channel as a finite additive-noise channel.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetric_transition
      role: test
      description: The additive construction has the registered q-ary symmetric transition probabilities.
    - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
      declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
      role: shared-api
      description: Operational average-error capacity defined through block codes and vanishing error.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetric_informationCapacity
      role: statement
      description: Exact single-letter information capacity in bits per channel use.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetricCapacityStatement
      role: statement
      description: Canonical operational capacity proposition on the atlas parameter range.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetric_operationalCapacity
      role: short-proof
      description: Operational capacity formula from the finite-channel coding theorem.
    - path: lean/CapacityAtlas/Channels/QarySymmetric.lean
      declaration: CapacityAtlas.Channel.qarySymmetricCapacityStatement_proof
      role: short-proof
      description: Direct proof of the registered q-ary symmetric proposition.
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
