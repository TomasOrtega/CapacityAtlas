id: directed-cycle-index-coding
title: Directed-cycle index-coding problem
status: solved
updated: '2026-09-14'
summary: Each receiver in a directed cycle knows its successor message and requests its own message.
tags:
  model:
  - index-coding
  features:
  - finite-alphabet
  - side-information
  - multiple-unicast
  - nonlinear-coding
  quantity:
  - symmetric-capacity
  knowledge:
  - exact
model:
  input: m independent equal-length messages, for m >= 3.
  output: A common noiseless broadcast word together with one local side-information message.
  law: Receiver r requests message r and knows message r+1 modulo m.
  assumptions:
  - Zero error is required for every message tuple.
  - Finite alphabets and vector block codes are unrestricted and need not be linear.
  - The symmetric rate is message blocklength divided by broadcast blocklength.
quantity:
  name: Directed-cycle index-coding problem capacity
  symbol: C_{\mathrm{sym}}
  units: message symbols per broadcast symbol
  criterion: Unrestricted zero-error block codes.
capacity:
  kind: exact
  display: C_{\mathrm{sym}}=1/(m-1)
bounds:
- id: published-capacity
  direction: exact
  relation: C_{\mathrm{sym}}=1/(m-1)
  method: A cycle linear code and an acyclic-subgraph converse valid for nonlinear codes.
  year: 2010
  references:
  - blasiak-kleinberg-lubetzky-2010
formalization:
  status: stated
  claims:
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: The directed cycle with k+3 messages has symmetric capacity 1/(k+2), for unrestricted
      zero-error codes.
    bound_ids:
    - published-capacity
