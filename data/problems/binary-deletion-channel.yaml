id: binary-deletion-channel
title: Binary deletion channel
abbreviation: BDC
status: open
featured: true
updated: '2026-08-10'
summary: Each input bit is independently deleted without an erasure marker; the exact capacity is unknown for every
  nontrivial deletion probability.
tags:
  model:
  - point-to-point
  features:
  - binary
  - finite-alphabet
  - memory
  - deletion
  quantity:
  - capacity
  knowledge:
  - bounds
parameters:
- symbol: d
  description: Independent deletion probability.
  range: 0<d<1
model:
  input: \(X^n\in\{0,1\}^n\)
  output: A random subsequence of the input, without deletion markers.
  law: Each bit is retained independently with probability \(1-d\); surviving bits keep their order.
  assumptions:
  - Neither terminal observes the deletion pattern.
  - Average decoding error vanishes.
quantity:
  name: Shannon capacity
  symbol: C_{\mathrm{del}}(d)
  units: bits per input bit
  criterion: Average-error operational capacity.
capacity:
  kind: bounds
  display: 0.1221(1-d)<C_{\mathrm{del}}(d)\le0.3578(1-d)
  lower: 0.1221(1-d)
  upper: 0.3578(1-d)
  conditions: The displayed pair is a simple uniform high-deletion summary; the upper bound shown holds for \(d\ge0.64\).
  notes: Pointwise numerical envelopes can be stronger.
bounds:
- id: run-length-lower-2023
  direction: lower
  relation: C_{\mathrm{del}}(d)>0.1221(1-d)
  method: Optimized run-length input distributions.
  year: 2023
  references:
  - rubinstein-con-2023
- id: parallel-ba-upper-2026
  direction: upper
  relation: C_{\mathrm{del}}(d)\le0.3578(1-d)
  method: Parallelized finite-block Blahut-Arimoto upper bounds.
  year: 2026
  references:
  - pinto-ribeiro-2026
  conditions: \(d\ge0.64\)
frontier:
  question: Determine \(C_{\mathrm{del}}(d)\), even at a benchmark value such as \(d=1/2\), or substantially narrow
    the gap.
  bottleneck: Deletions destroy alignment, and finite-letter optimizations grow exponentially without a known single-letter
    reduction.
  progress:
  - Improve a certified pointwise bound.
  - Prove structure of capacity-achieving stationary inputs.
  - Develop compact certificates suitable for formal checking.
formalization:
  statement:
    status: none
    language: Lean
    claims: []
    notes: Variable-length outputs and synchronization errors are not yet modeled.
    files: []
  proofs: []
references:
- rubinstein-con-2023
- pinto-ribeiro-2026
