id: costa-dirty-paper-channel
title: Gaussian dirty-paper channel
status: solved
featured: true
updated: '2026-09-14'
summary: Additive Gaussian interference known noncausally to the encoder causes no capacity loss.
tags:
  model:
  - point-to-point
  features:
  - continuous-alphabet
  - gaussian
  - additive-noise
  - noncausal-state
  - side-information
  - power-constraint
  quantity:
  - capacity
  knowledge:
  - exact
model:
  input: \(X\in\mathbb R\), with average power \(P\).
  output: \(Y=X+S+Z\).
  law: Gaussian state \(S\) is known noncausally to the encoder; \(Z\sim\mathcal N(0,N)\) is independent.
  assumptions:
  - The decoder does not know S.
  - State and noise are iid Gaussian.
  - For every message m, E_{S^n}[sum_t x_t(m,S^n)^2] <= n P. Energy is integrable under the iid state
    law. The bound is not pathwise in the state and is not averaged over messages.
quantity:
  name: Dirty-paper capacity
  symbol: C_{\mathrm{DPC}}
  units: bits per channel use
  criterion: Average-error capacity. Resource averaging is fixed by the explicit model assumption below.
capacity:
  kind: exact
  display: C_{\mathrm{DPC}}=\frac12\log_2\!\left(1+\frac PN\right)
  notes: The value is independent of the state variance.
bounds:
- id: dirty-paper-achievability
  direction: lower
  relation: C_{\mathrm{DPC}}\ge\frac12\log_2(1+P/N)
  method: Gaussian Gel'fand-Pinsker coding pre-cancels the known interference.
  year: 1983
  references:
  - costa-1983
- id: genie-converse
  direction: upper
  relation: C_{\mathrm{DPC}}\le\frac12\log_2(1+P/N)
  method: Reveal the interference to the decoder and apply the AWGN converse.
  year: 1983
  references:
  - costa-1983
formalization:
  status: stated
  claims:
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: Noncausal independent Gaussian interference at the encoder causes no capacity loss.
    bound_ids:
    - dirty-paper-achievability
    - genie-converse
  notes: 'Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion. Power convention:
    PerMessageStateAveragePowerAdmissible. No equivalence to another power convention is assumed.'
  files:
  - path: lean/CapacityAtlas/Claims/DirtyPaper.lean
    declaration: CapacityAtlas.Claims.dirtyPaper
    role: claim
    description: Noncausal independent Gaussian interference at the encoder causes no capacity loss.
    claim_id: operational-capacity
  proofs: []
