id: binary-symmetric-channel
title: Binary symmetric channel
abbreviation: BSC
status: solved
featured: true
updated: '2026-08-13'
summary: Each bit is independently flipped with probability p, giving the canonical finite noisy channel.
tags:
  model:
  - point-to-point
  features:
  - binary
  - finite-alphabet
  - discrete-memoryless
  - symmetric
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: p
  description: Crossover probability.
  range: 0\le p\le1/2
model:
  input: \(X\in\{0,1\}\)
  output: \(Y\in\{0,1\}\)
  law: \(Y=X\oplus Z\), where \(Z\sim\mathrm{Bernoulli}(p)\) independently across uses.
  assumptions:
  - The range p at most 1/2 removes the equivalent relabelled regime.
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C_{\mathrm{BSC}}(p)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: exact
  display: C_{\mathrm{BSC}}(p)=1-h_2(p)
  conditions: \(0\le p\le1/2\).
  notes: The uniform input distribution achieves capacity.
bounds:
- id: uniform-input-achievability
  direction: lower
  relation: C\ge1-h_2(p)
  method: Apply the DMC coding theorem to independent uniform inputs.
  year: 1948
  references:
  - shannon-1948
- id: symmetric-channel-converse
  direction: upper
  relation: C\le1-h_2(p)
  method: Maximize mutual information; symmetry makes the uniform input optimal.
  year: 1948
  references:
  - shannon-1948
formalization:
  status: stated
  claims:
  - id: information-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 2
    description: For 0 ≤ p ≤ 1/2, the single-letter information capacity is 1-h₂(p) bits per use.
  - id: operational-capacity
    kind: exact-capacity
    category: solved
    formal_status: proved
    version: 2
    description: For 0 ≤ p ≤ 1/2, operational vanishing-average-error capacity is 1-h₂(p) bits per use.
  notes: The single-letter information capacity is proved from reusable finite-distribution and entropy
    APIs. The operational average-error formula is proved locally by applying the formal finite-channel
    coding theorem.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/BinarySymmetric.lean
    declaration: CapacityAtlas.FiniteChannel.informationCapacityBits_eq_binarySymmetric
    role: API
    description: Information capacity of any finite channel with binary-symmetric transition rows.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
    declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
    role: API
    description: Operational average-error capacity defined through block codes and vanishing error.
  - path: lean/CapacityAtlas/Channels/Binary.lean
    declaration: CapacityAtlas.Channel.binarySymmetric
    role: definition
    description: Binary symmetric channel as a finite stochastic channel.
  - path: lean/CapacityAtlas/Channels/Binary.lean
    declaration: CapacityAtlas.Channel.binarySymmetric_zero
    role: test
    description: At p=0 the channel is the identity.
  - path: lean/CapacityAtlas/Channels/Binary.lean
    declaration: CapacityAtlas.Channel.binarySymmetric_informationCapacity
    role: claim
    description: For 0 ≤ p ≤ 1/2, the single-letter information capacity is 1-h₂(p) bits per use.
    claim_id: information-capacity
  - path: lean/CapacityAtlas/Channels/Binary.lean
    declaration: CapacityAtlas.Channel.binarySymmetric_operationalCapacity
    role: claim
    description: For 0 ≤ p ≤ 1/2, operational vanishing-average-error capacity is 1-h₂(p) bits per use.
    claim_id: operational-capacity
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
