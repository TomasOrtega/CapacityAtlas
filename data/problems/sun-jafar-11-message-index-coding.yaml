id: sun-jafar-11-message-index-coding
title: Sun-Jafar 11-message multiple-unicast index-coding instance
abbreviation: SJ11
status: open
featured: true
updated: '2026-08-12'
summary: A multiple-unicast instance where the exact nonlinear symmetric capacity is separated from the known linear
  answer.
tags:
  model:
  - index-coding
  features:
  - finite-alphabet
  - multiple-unicast
  - non-shannon
  - nonlinear-coding
  quantity:
  - symmetric-capacity
  knowledge:
  - bounds
  - linear-only
model:
  input: Eleven independent messages \(W_1,\ldots,W_{11}\) held by one broadcaster.
  output: Receiver \(j\) recovers \(W_j\) from the broadcast and its side information.
  law: The unknown interferer sets are \(\{4,5\},\{5\},\varnothing,\varnothing,\{2\},\{2,3\},\{1,3\},\{2,4\},\{3,4\},\{3,5\},\{4,6\}\).
  assumptions:
  - Messages are uniform, independent, equal-length words over one common finite alphabet.
  - Decoding error is exactly zero for every message tuple and receiver.
  - Arbitrary finite alphabets, blocklengths, and nonlinear encoders and decoders are allowed.
quantity:
  name: Nonlinear symmetric capacity
  symbol: C_{\mathrm{sym}}
  units: message symbols per broadcast symbol
  criterion: Zero-error symmetric multiple-unicast capacity in message symbols per broadcast symbol.
capacity:
  kind: bounds
  display: \frac5{13}\le C_{\mathrm{sym}}\le\frac{11}{28}
  lower: \frac5{13}
  upper: \frac{11}{28}
  conjectured: \frac5{13}
  notes: The linear symmetric capacity is exactly 5/13.
bounds:
- id: vector-linear-code
  direction: lower
  relation: C_{\mathrm{sym}}\ge\frac5{13}
  method: Explicit vector-linear interference alignment.
  year: 2015
  references:
  - sun-jafar-2015
- id: zhang-yeung-converse
  direction: upper
  relation: C_{\mathrm{sym}}\le\frac{11}{28}
  method: Entropic converse using a non-Shannon inequality.
  year: 2015
  references:
  - sun-jafar-2015
  - zhang-yeung-1998
- id: linear-capacity
  direction: linear-exact
  relation: C_{\mathrm{sym}}^{\mathrm{linear}}=\frac5{13}
  method: Achievability plus an Ingleton linear-rank converse.
  year: 2015
  references:
  - sun-jafar-2015
- id: shannon-polymatroid-limit
  direction: upper
  relation: C_{\mathrm{sym}}\le\frac25
  method: Best outer bound obtainable from normalized Shannon polymatroid constraints.
  year: 2015
  notes: The Zhang-Yeung inequality strictly improves this relaxation value.
  references:
  - sun-jafar-2015
frontier:
  question: Prove \(C_{\mathrm{sym}}=5/13\), or construct a nonlinear code above \(5/13\).
  bottleneck: Linear-rank inequalities close the linear problem, while known entropic inequalities do not close
    the nonlinear gap.
  progress:
  - Improve either endpoint with an auditable certificate.
  - Rule out a concrete nonlinear code family.
  - Formalize the linear code or entropic converse.
  subproblems:
  - title: Formalize the operational zero-error and vector-linear capacity quantities.
    status: done
  - title: Machine-check the one-based table, alignment graph, inner diamond, and internal conflict distance.
    status: done
  - title: Formalize the 5/13 vector-linear code.
    status: open
  - title: Formalize the 11/28 converse.
    status: open
formalization:
  statement:
    status: statement
    version: 2
    language: Lean
    notes: The canonical proposition now fixes zero error, alphabet scope, arbitrary blocklength, nonlinear capacity, and global vector-linear capacity.
