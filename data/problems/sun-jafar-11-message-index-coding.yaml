    - path: lean/CapacityAtlas/Network/SunJafar11.lean
      declaration: CapacityAtlas.IndexCoding.sunJafar11_linear_converse
      role: statement
      description: Global finite-field vector-linear converse.
    - path: lean/CapacityAtlas/Network/SunJafar11.lean
