id: sun-jafar-11-message-index-coding
title: Sun-Jafar 11-message multiple-unicast index-coding instance
abbreviation: SJ11
status: open
featured: true
updated: '2026-08-12'
summary: A multiple-unicast instance where the exact nonlinear symmetric capacity is separated from the known linear-encoder
  answer.
tags:
  model:
  - index-coding
  features:
  - finite-alphabet
  - multiple-unicast
  - non-shannon
  - nonlinear-coding
  quantity:
  - symmetric-capacity
  knowledge:
  - bounds
  - linear-encoder-only
model:
  input: Eleven independent messages \(W_1,\ldots,W_{11}\) held by one broadcaster.
  output: Receiver \(j\) recovers \(W_j\) from the broadcast and its side information.
  law: The unknown interferer sets are \(\{4,5\},\{5\},\varnothing,\varnothing,\{2\},\{2,3\},\{1,3\},\{2,4\},\{3,4\},\{3,5\},\{4,6\}\).
  assumptions:
  - Messages are uniform, independent, equal-length words over one common finite alphabet.
  - Decoding error is exactly zero for every message tuple and receiver.
  - Arbitrary finite alphabets, blocklengths, and nonlinear encoders and decoders are allowed.
quantity:
  name: Nonlinear symmetric capacity
  symbol: C_{\mathrm{sym}}
  units: message symbols per broadcast symbol
  criterion: Zero-error symmetric multiple-unicast capacity in message symbols per broadcast symbol.
capacity:
  kind: bounds
  display: \frac5{13}\le C_{\mathrm{sym}}\le\frac{11}{28}
  lower: \frac5{13}
  upper: \frac{11}{28}
  conjectured: \frac5{13}
  notes: The linear-encoder symmetric capacity is exactly 5/13. The formal quantity constrains the encoder to be linear
    and permits arbitrary zero-error decoders; equivalence with a definition requiring linear decoders is not yet established.
bounds:
- id: vector-linear-code
  direction: lower
  relation: C_{\mathrm{sym}}\ge\frac5{13}
  method: Explicit vector-linear interference alignment.
  year: 2015
  references:
  - sun-jafar-2015
- id: zhang-yeung-converse
  direction: upper
  relation: C_{\mathrm{sym}}\le\frac{11}{28}
  method: Entropic converse using a non-Shannon inequality.
  year: 2015
  references:
  - sun-jafar-2015
  - zhang-yeung-1998
- id: linear-encoder-capacity
  direction: linear-encoder-exact
  relation: C_{\mathrm{sym}}^{\mathrm{linear\text{-}enc}}=\frac5{13}
  method: Linear-encoder achievability plus an Ingleton linear-rank converse.
  year: 2015
  references:
  - sun-jafar-2015
- id: shannon-polymatroid-limit
  direction: upper
  relation: C_{\mathrm{sym}}\le\frac25
  method: Best outer bound obtainable from normalized Shannon polymatroid constraints.
  year: 2015
  notes: The Zhang-Yeung inequality strictly improves this relaxation value.
  references:
  - sun-jafar-2015
frontier:
  question: Prove \(C_{\mathrm{sym}}=5/13\), or construct a nonlinear code above \(5/13\).
  bottleneck: Linear-rank inequalities close the linear-encoder problem, while known entropic inequalities do not close
    the nonlinear gap.
  progress:
  - Improve either endpoint with an auditable certificate.
  - Rule out a concrete nonlinear code family.
  - Formalize the linear code or entropic converse.
  subproblems:
  - title: Formalize the operational zero-error and linear-encoder capacity quantities.
    status: done
  - title: Machine-check the one-based table, alignment graph, inner diamond, and internal conflict distance.
    status: done
  - title: Formalize the 5/13 vector-linear code.
    status: open
  - title: Formalize the 11/28 converse.
    status: open
formalization:
  statement:
    status: statement
    language: Lean
    claims:
    - id: exact-capacity
      kind: exact-capacity
      status: open
      version: 2
      description: Exact unrestricted nonlinear zero-error symmetric capacity.
    - id: linear-achievability
      kind: achievability
      status: open
      version: 3
      description: Published 5/13 linear-encoder achievability bound.
    - id: unrestricted-achievability
      kind: achievability
      status: open
      version: 1
      description: Unrestricted 5/13 lower bound derived from linear-encoder achievability.
    - id: linear-converse
      kind: converse
      status: open
      version: 2
      description: Global finite-field linear-encoder converse.
    - id: nonlinear-converse
      kind: converse
      status: open
      version: 2
      description: Zhang-Yeung nonlinear upper bound.
    - id: shannon-relaxation-value
      kind: converse
      status: open
      version: 2
      description: Exact value of the Shannon polymatroid relaxation.
    - id: shannon-outer-bound
      kind: converse
      status: open
      version: 1
      description: Operational 2/5 outer bound derived from the Shannon relaxation.
    - id: internal-conflicts-exact
      kind: structural
      status: proved
      version: 1
      description: Exact enumeration of the abstractly defined internal conflicts.
    - id: internal-conflict-distance
      kind: structural
      status: proved
      version: 1
      description: Every internal conflict has alignment-graph distance two.
    notes: The canonical propositions fix zero error, alphabet scope, arbitrary blocklength, nonlinear capacity, and
      global linear-encoder capacity. Linear decoders are not required by the current formal quantity.
    files:
    - path: lean/CapacityAtlas/Network/SunJafar11.lean
