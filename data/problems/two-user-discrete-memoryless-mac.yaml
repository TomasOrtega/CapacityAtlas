id: two-user-discrete-memoryless-mac
title: Two-user discrete memoryless multiple-access channel
abbreviation: DM-MAC
status: solved
updated: '2026-08-10'
summary: Two independent senders communicate to one receiver through a memoryless channel.
tags:
  model:
  - multiple-access
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity-region
  knowledge:
  - exact
  - single-letter-characterization
model:
  input: Independent encoder inputs \(X_1\in\mathcal X_1\) and \(X_2\in\mathcal X_2\).
  output: A common receiver observes \(Y\in\mathcal Y\).
  law: A memoryless transition law \(p(y\mid x_1,x_2)\).
  assumptions:
  - The messages are independent.
  - Time sharing is allowed.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{MAC}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average joint decoding error.
capacity:
  kind: region
  display: \bigcup_{p(q)p(x_1|q)p(x_2|q)}\!\left\{\begin{array}{l}R_1\le I(X_1;Y|X_2,Q),\\R_2\le I(X_2;Y|X_1,Q),\\R_1+R_2\le
    I(X_1,X_2;Y|Q)\end{array}\right\}
  notes: Q is a time-sharing variable.
bounds:
- id: mac-random-coding-inner
  direction: inner-region
  relation: R_1\le I(X_1;Y|X_2,Q),\ R_2\le I(X_2;Y|X_1,Q),\ R_1+R_2\le I(X_1,X_2;Y|Q)
  method: Independent random codebooks and joint decoding.
  year: 1971
  references:
  - ahlswede-1971
  - liao-1972
- id: mac-converse
  direction: outer-region
  relation: R_1\le I(X_1;Y|X_2,Q),\ R_2\le I(X_2;Y|X_1,Q),\ R_1+R_2\le I(X_1,X_2;Y|Q)
  method: Fano's inequality and single-letterization.
  year: 1972
  references:
  - ahlswede-1971
  - liao-1972
formalization:
  statement:
    status: none
    version: 1
    language: Lean
    notes: Product distributions, rate regions, and the MAC coding theorem are not yet formalized.
    files: []
  proofs: []
references:
- ahlswede-1971
