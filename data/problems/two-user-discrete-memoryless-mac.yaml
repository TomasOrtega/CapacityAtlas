id: two-user-discrete-memoryless-mac
title: Two-user discrete memoryless multiple-access channel
abbreviation: DM-MAC
status: solved
updated: '2026-09-11'
summary: Two independent senders communicate to one receiver through a finite memoryless channel.
tags:
  model: [multiple-access]
  features: [finite-alphabet, discrete-memoryless]
  quantity: [capacity-region]
  knowledge: [exact, single-letter-characterization]
model:
  input: Separate deterministic encoders map independent uniform messages to words over finite nonempty alphabets \(\mathcal X_1\) and \(\mathcal X_2\).
  output: One receiver observes a word over a finite nonempty alphabet \(\mathcal Y\) and jointly decodes both messages.
  law: The length-n transition probability is \(\prod_{i=1}^n W(y_i\mid x_{1i},x_{2i})\).
  assumptions:
  - Each encoder depends only on its own message; there is no feedback or message sharing.
  - Blocklengths and any deterministic time-sharing schedule are fixed as part of the code.
  - There are no input-cost constraints.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{MAC}}
  units: rate pairs in bits per channel use
  criterion: Nonnegative rate pairs supported at every sufficiently large blocklength with arbitrarily small average joint decoding error and arbitrarily small rate slack.
capacity:
  kind: region
  display: \bigcup_{p(q)p(x_1|q)p(x_2|q)}\!\left\{\begin{array}{l}R_1,R_2\ge0,\\R_1\le I(X_1;Y|X_2,Q),\\R_2\le I(X_2;Y|X_1,Q),\\R_1+R_2\le I(X_1,X_2;Y|Q)\end{array}\right\}
  notes: Q ranges over finite time-sharing alphabets. Ahlswede's Theorem 1 (page 33) gives the equivalent closed convex hull of successive-decoding corner rates. The cited proceedings were published in 1973 following the September 1971 conference; the bound dates below identify that verified publication.
bounds:
- id: mac-random-coding-inner
  direction: inner-region
  relation: R_1,R_2\ge0,\ R_1\le I(X_1;Y|X_2,Q),\ R_2\le I(X_2;Y|X_1,Q),\ R_1+R_2\le I(X_1,X_2;Y|Q)
  method: Independent random codebooks, successive decoding of corner rates, and time sharing; Ahlswede's Theorem 1, pages 33–38.
  year: 1973
  references: [ahlswede-1971]
- id: mac-converse
  direction: outer-region
  relation: R_1,R_2\ge0,\ R_1\le I(X_1;Y|X_2,Q),\ R_2\le I(X_2;Y|X_1,Q),\ R_1+R_2\le I(X_1,X_2;Y|Q)
  method: Fano's inequality and memoryless information bounds with a common time coordinate; Ahlswede's Theorem 1, pages 33–38.
  year: 1973
  references: [ahlswede-1971]
formalization:
  status: stated
  claims:
  - id: exact-capacity
    kind: exact-capacity
    category: solved
    formal_status: stated
    version: 1
    description: The complete average-error capacity region with separate deterministic encoders equals the three single-letter inequalities over arbitrary finite time sharing, including boundary rates and zero-rate axes.
  notes: The canonical region uses separate positive message counts, a joint decoder, and rate slack at every sufficiently large blocklength. The information region is a literal finite-Q union.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/MultipleAccess.lean
    declaration: CapacityAtlas.MultipleAccess.BlockCode
    role: API
    description: Separate deterministic message encoders and one joint decoder.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/MultipleAccess.lean
    declaration: CapacityAtlas.MultipleAccess.operationalRegion
    role: API
    description: Nonnegative achievable rate pairs with vanishing average joint error and rate slack.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/MultipleAccess.lean
    declaration: CapacityAtlas.MultipleAccess.informationRegion
    role: API
    description: All three averaged information inequalities under independent conditional input laws and finite time sharing.
  - path: lean/CapacityAtlas/Channels/MultipleAccess.lean
    declaration: CapacityAtlas.Channel.multipleAccessCapacityStatement
    role: claim
    claim_id: exact-capacity
    description: Canonical operational MAC capacity-region equality.
  proofs: []
references: [ahlswede-1971, liao-1972, elgamal-kim-2011]
