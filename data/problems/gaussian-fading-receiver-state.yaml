id: gaussian-fading-receiver-state
title: Gaussian fading channel with receiver-only state information
status: solved
updated: '2026-09-14'
summary: Iid real fading gains known only to the receiver determine ergodic capacity under a fixed power
  budget.
tags:
  model:
  - point-to-point
  features:
  - continuous-alphabet
  - gaussian
  - side-information
  - power-constraint
  quantity:
  - capacity
  knowledge:
  - single-letter-characterization
model:
  input: Real symbols with a maximum-codeword block-average power limit P.
  output: The receiver observes each fading gain H and the corresponding real output Y.
  law: Y=HX+Z, with iid gains of a fixed Borel probability law and independent iid N(0,N) noise.
  assumptions:
  - P >= 0 and N > 0.
  - The encoder has no gain information. The receiver sees the complete gain and output words.
  - The expected value of log2(1+H^2 P/N) is finite.
  - This is ergodic capacity, not outage capacity. Decoder decision regions are measurable.
  - For every message m, sum_t x_t(m)^2 <= n P. Inputs do not depend on the fading gains. There is no
    gain-dependent power adaptation or averaging of the power constraint over gains.
quantity:
  name: Gaussian fading channel with receiver-only state information capacity
  symbol: C
  units: bits per channel use
  criterion: Vanishing average block error, with the constraints specified in the model. Resource averaging
    is fixed by the explicit model assumption below.
capacity:
  kind: characterization
  display: C=\mathbb E[\tfrac12\log_2(1+H^2P/N)]
