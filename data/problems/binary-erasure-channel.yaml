id: binary-erasure-channel
title: Binary erasure channel
abbreviation: BEC
status: solved
updated: '2026-08-11'
summary: Each transmitted bit is received correctly or replaced by a visible erasure symbol.
tags:
  model:
  - point-to-point
  features:
  - binary
  - finite-alphabet
  - discrete-memoryless
  - symmetric
  - erasure
  quantity:
  - capacity
  knowledge:
  - exact
parameters:
- symbol: \varepsilon
  description: Erasure probability.
  range: 0\le\varepsilon\le1
model:
  input: \(X\in\{0,1\}\)
  output: \(Y\in\{0,1,?\}\)
  law: \(Y=X\) with probability \(1-\varepsilon\), and \(Y=?\) with probability \(\varepsilon\).
  assumptions:
  - Channel uses are independent.
  - Average decoding error vanishes with blocklength.
quantity:
  name: Shannon capacity
  symbol: C_{\mathrm{BEC}}(\varepsilon)
  units: bits per channel use
  criterion: Average-error capacity.
capacity:
  kind: exact
  display: C_{\mathrm{BEC}}(\varepsilon)=1-\varepsilon
  conditions: \(0\le\varepsilon\le1\).
bounds:
- id: erasure-achievability
  direction: lower
  relation: C\ge1-\varepsilon
  method: Random coding or linear erasure-correcting codes.
  year: 1948
  references:
  - shannon-1948
- id: erasure-converse
  direction: upper
  relation: C\le1-\varepsilon
  method: At most one bit passes through each unerased position.
  year: 1948
  references:
  - shannon-1948
formalization:
  statement:
    status: statement
    version: 1
    language: Lean
    notes: The information-capacity formula is proved from explicit output and conditional-entropy identities. The
      operational average-error formula follows from the formal finite-channel coding theorem.
    files:
    - path: lean/CapacityAtlas/Channels/Binary.lean
      declaration: CapacityAtlas.Channel.binaryErasure
      role: definition
      description: Binary erasure channel as a finite stochastic channel.
    - path: lean/CapacityAtlasForMathlib/InformationTheory/OperationalCapacity.lean
      declaration: CapacityAtlas.FiniteChannel.operationalCapacityBits
      role: shared-api
      description: Operational average-error capacity defined through block codes and vanishing error.
    - path: lean/CapacityAtlas/Channels/Binary.lean
      declaration: CapacityAtlas.Channel.binaryErasure_informationCapacity
      role: statement
      description: Exact single-letter information capacity in bits per channel use.
    - path: lean/CapacityAtlas/Channels/Binary.lean
      declaration: CapacityAtlas.Channel.binaryErasureCapacityStatement
      role: statement
      description: Canonical operational average-error capacity proposition.
    - path: lean/CapacityAtlas/Channels/Binary.lean
      declaration: CapacityAtlas.Channel.binaryErasure_operationalCapacity
      role: short-proof
      description: Unconditional operational BEC capacity formula from the finite-channel coding theorem.
    - path: lean/CapacityAtlas/Channels/Binary.lean
      declaration: CapacityAtlas.Channel.binaryErasureCapacityStatement_proof
      role: short-proof
      description: Direct proof of the registered BEC proposition.
  proofs: []
references:
- shannon-1948
- cover-thomas-2006
