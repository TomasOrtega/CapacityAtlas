id: general-finite-wiretap-channel
title: General finite wiretap channel
status: solved
updated: '2026-08-13'
summary: The unconstrained finite wiretap channel has a single-auxiliary secrecy-capacity characterization without a degradedness assumption.
tags:
  model: [wiretap]
  features: [finite-alphabet, discrete-memoryless, secrecy]
  quantity: [secrecy-capacity]
  knowledge: [exact, single-letter-characterization]
model:
  input: Symbols in a finite alphabet \(\mathcal X\), encoded using private randomness.
  output: Legitimate output \(Y\) and eavesdropper output \(Z\) from two DMC marginals with common input.
  law: Arbitrary finite transition laws \(W_Y(y\mid x)\) and \(W_Z(z\mid x)\).
  assumptions:
  - Messages are uniform and the stochastic encoder randomness is private.
  - Legitimate average decoding error vanishes.
  - Strong secrecy means unnormalized leakage \(I(M;Z^n)\) tends to zero.
quantity:
  name: Strong-secrecy capacity
  symbol: C_s
  units: secret bits per channel use
  criterion: Vanishing legitimate average error and strong information-theoretic secrecy.
capacity:
  kind: characterization
  display: C_s=\max_{V-X-(Y,Z)}\bigl[I(V;Y)-I(V;Z)\bigr]
  conditions: Finite alphabets and no input-cost constraint.
bounds:
- id: auxiliary-characterization
  direction: exact
  relation: C_s=\max_{V-X-(Y,Z)}[I(V;Y)-I(V;Z)]
  method: Random binning and an auxiliary-random-variable converse.
  year: 1978
  references: [csiszar-korner-1978]
formalization:
  status: definitions
  claims: []
  notes: Concrete definitions are retained; no capacity or bound claim is formally stated.
  files:
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteWiretapChannel.lean
    declaration: CapacityAtlas.FiniteWiretapChannel
    role: definition
    description: Pair of finite legitimate and eavesdropper channels.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteWiretapChannel.lean
    declaration: CapacityAtlas.WiretapCode
    role: definition
    description: Finite stochastic wiretap block-code structure.
  - path: lean/CapacityAtlasForMathlib/InformationTheory/FiniteWiretapChannel.lean
    declaration: CapacityAtlas.finiteWiretapAuxiliaryCapacity
    role: definition
    description: Single-auxiliary information expression.
  proofs: []
references: [csiszar-korner-1978, sreekumar-et-al-2020]
