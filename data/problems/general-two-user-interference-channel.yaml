id: general-two-user-interference-channel
title: General two-user discrete memoryless interference channel
status: open
featured: true
updated: '2026-09-14'
summary: Two transmitter-receiver pairs interfere, and the exact capacity region is unknown in general.
tags:
  model:
  - interference
  features:
  - finite-alphabet
  - discrete-memoryless
  quantity:
  - capacity-region
  knowledge:
  - bounds
model:
  input: Independent inputs \(X_1,X_2\).
  output: Receivers observe \(Y_1,Y_2\).
  law: An arbitrary memoryless law \(p(y_1,y_2|x_1,x_2)\).
  assumptions:
  - Receiver i requests only message i.
  - No strong- or weak-interference ordering is assumed.
quantity:
  name: Capacity region
  symbol: \mathcal C_{\mathrm{IC}}
  units: rate pairs in bits per channel use
  criterion: Vanishing average error at both receivers.
capacity:
  kind: bounds
  display: \mathcal R_{\mathrm{HK}}\subseteq\mathcal C_{\mathrm{IC}}\subseteq\mathcal R_{\mathrm{outer}}
  lower: \mathcal R_{\mathrm{HK}}
  upper: \mathcal R_{\mathrm{outer}}
  notes: No universally tight single-letter outer bound is known.
bounds:
- id: han-kobayashi-inner
  direction: inner-region
  relation: \mathcal R_{\mathrm{HK}}\subseteq\mathcal C
  method: Split each message into common and private parts.
  year: 1981
  references:
  - han-kobayashi-1981
- id: cut-and-genie-outers
  direction: outer-region
  relation: \mathcal C\subseteq\mathcal R_{\mathrm{outer}}
  method: Cut-set, genie-aided, and receiver-cooperation converses.
  year: 1981
  references:
  - han-kobayashi-1981
  - elgamal-kim-2011
- id: cooperative-cut-set
  direction: outer-region
  relation: \mathcal C\subseteq\mathcal R_{\mathrm{cut}}
  method: The fixed cooperative cut-set region defined in Interference.cutSet, with a conditionally independent
    coupling of the two receiver marginals.
  year: 2011
  references:
  - elgamal-kim-2011
  notes: This selected region is not a formalization of every cut-and-genie bound listed above.
frontier:
  question: Determine the capacity region of the general two-user interference channel.
  bottleneck: The optimal extent of partial interference decoding depends delicately on the channel, while
    existing outer bounds lose the distributed decoding structure.
  progress:
  - Close the region for a new nontrivial subclass.
  - Separate Han-Kobayashi from a known outer bound on an explicit channel.
  - Formalize one exact-capacity regime before the general problem.
formalization:
  status: stated
  claims:
  - id: han-kobayashi-cut-set
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: A fixed Han--Kobayashi inner region and cooperative cut-set outer region.
    bound_ids:
    - han-kobayashi-inner
    - cooperative-cut-set
  - id: han-kobayashi-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked han kobayashi achievability.
    bound_ids:
    - han-kobayashi-inner
  - id: cut-set-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked cut set converse.
    bound_ids:
    - cooperative-cut-set
  notes: Concrete operational definitions and admitted research statements are present. Existing proofs
    are preserved. New statements require mathematical review and proof completion.
  files:
  - path: lean/CapacityAtlas/Claims/InterferenceBounds.lean
    declaration: CapacityAtlas.Claims.interferenceBounds
    role: claim
    description: A fixed Han--Kobayashi inner region and cooperative cut-set outer region.
    claim_id: han-kobayashi-cut-set
  - path: lean/CapacityAtlas/Claims/InterferenceBounds.lean
    declaration: CapacityAtlas.Claims.interferenceHanKobayashi
    role: claim
    description: Independently tracked han kobayashi achievability.
    claim_id: han-kobayashi-achievability
  - path: lean/CapacityAtlas/Claims/InterferenceBounds.lean
    declaration: CapacityAtlas.Claims.interferenceCutSet
    role: claim
    description: Independently tracked cut set converse.
    claim_id: cut-set-converse
  proofs: []
references:
- han-kobayashi-1981
- elgamal-kim-2011
