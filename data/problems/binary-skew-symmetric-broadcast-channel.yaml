id: binary-skew-symmetric-broadcast-channel
title: Binary skew-symmetric broadcast channel
abbreviation: BSSC
status: open
featured: true
updated: '2026-09-14'
summary: The capacity region of this binary-input broadcast channel remains unknown.
tags:
  model:
  - broadcast
  features:
  - finite-alphabet
  - discrete-memoryless
  - binary
  - asymmetric
  quantity:
  - capacity-region
  knowledge:
  - bounds
model:
  input: A binary symbol \(X\).
  output: Binary outputs \(Y_1,Y_2\).
  law: For \(X=0\), \(Y_1=0\) and \(Y_2\) is fair; for \(X=1\), \(Y_1\) is fair and \(Y_2=1\).
  assumptions:
  - Independent private messages are sent to the receivers.
  - Average probability that either receiver errs vanishes.
quantity:
  name: Private-message capacity region
  symbol: \mathcal C_{\mathrm{BSSC}}
  units: ordered pairs of bits per channel use
  criterion: Closure of achievable private-message rate pairs.
capacity:
  kind: bounds
  display: \mathcal R_{\mathrm{Marton}}\subseteq\mathcal C_{\mathrm{BSSC}}\subseteq\mathcal R_{\mathrm{UV}}
  notes: Equality of the named inner and outer descriptions is the canonical formal target.
bounds:
- id: marton-inner
  direction: inner-region
  relation: \mathcal R_{\mathrm{Marton}}\subseteq\mathcal C_{\mathrm{BSSC}}
  method: Marton coding specialized to binary input and symmetric outputs.
  year: 1979
  references:
  - marton-1979
- id: uv-outer
  direction: outer-region
  relation: \mathcal C_{\mathrm{BSSC}}\subseteq\mathcal R_{\mathrm{UV}}
  method: Auxiliary-variable broadcast outer bound.
  year: 2007
  references:
  - nair-elgamal-2007
  - geng-et-al-2010
frontier:
  question: Close the gap between the best Marton-type inner region and UV-type outer region for the fixed
    BSSC law.
  bottleneck: Known auxiliary-variable optimizations do not coincide on all supporting hyperplanes.
  progress:
  - Certify a strict separating rate pair or prove the two optimized descriptions equal.
formalization:
  status: stated
  claims:
  - id: marton-uv-bounds
    kind: capacity-bounds
    category: solved
    formal_status: stated
    version: 1
    description: Marton/UV bounds specialized to the concrete binary skew-symmetric channel.
    bound_ids:
    - marton-inner
    - uv-outer
  - id: marton-achievability
    kind: achievability
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked marton achievability.
    bound_ids:
    - marton-inner
  - id: uv-converse
    kind: converse
    category: solved
    formal_status: stated
    version: 1
    description: Independently tracked uv converse.
    bound_ids:
    - uv-outer
  notes: New statements await mathematical review and proofs.
  files:
  - path: lean/CapacityAtlas/Channels/Broadcast.lean
